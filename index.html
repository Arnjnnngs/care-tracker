// =================================================================================================
// EXPORT — CSV + printable report (v43)
//
// WHY THIS EXISTS. Everything Brandi has ever logged lives in one Firestore project with no copy
// anywhere. This is her first backup. That is the primary purpose; handing a printed record to an
// oncologist is the secondary one.
//
// THE ONE INVARIANT: this block is STRICTLY READ-ONLY. WEB-MAIN has exactly four mutation
// mechanisms -- addEntryDB, removeEntryDB, setDoc (prefs / fcm_tokens) and persistMedicationConfig
// -- all named functions with no dynamic dispatch anywhere in the file. Nothing below references
// any of them, and nothing below writes to localStorage. That is mechanically checkable with a
// grep, which is the whole safety argument for shipping this before anything else touches her app.
// If you add to this block, keep that property or the argument dies.
// =================================================================================================

// RFC-4180 quoting, plus the leading apostrophe that stops Excel and Sheets executing a cell that
// begins =, +, - or @ as a formula. A medication note starting with "-" is not a spreadsheet macro.
function csvField(v) {
  let s = (v === null || v === undefined) ? '' : String(v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function escHtml(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
// For a value going inside a CSS string literal (the @page margin-box `content:` running header).
// escHtml is wrong there: `&quot;` would print literally. A stray `"` or `</style>` would break out
// of the block, so both the quote characters and the tag delimiters are neutralised.
function cssStr(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/'/g, "\\'")
    .replace(/</g, '\\00003c').replace(/>/g, '\\00003e')
    .replace(/[\r\n]+/g, ' ');
}

// state.entries deliberately EXCLUDES chemo_date -- subscribeEntries splits those into
// state.chemoDates so every other view can ignore them. For a backup they must come back in: they
// are real documents in caretracker_entries and they are the treatment calendar the whole app
// pivots on. If the export is the only copy, leaving them out means her chemo schedule is the one
// thing that cannot be restored.
function allExportEntries() {
  return (state.entries || []).concat(state.chemoDates || []);
}

// A cleared chemo date is written with ts:0 as an audit tombstone. Chronologically that is 1 Jan
// 1970, which would otherwise sort to the top of the CSV and print a 1970 heading in the report.
function exportSortTs(e) {
  return (e.medId === 'chemo_date' && !e.ts) ? (e.loggedAt || 0) : (e.ts || 0);
}

function reportNameOf(id) {
  if (!id) return '';
  // hasOwnProperty, not a bare index -- see nameOf(). A bare index made every id that is also
  // an Object.prototype key read as "known", which suppressed the "Medication (removed)"
  // label in the document handed to an oncologist.
  const known = (state.meds || []).some(m => m.id === id) || !!(state.archivedMeds && Object.prototype.hasOwnProperty.call(state.archivedMeds, id));
  const n = nameOf(id);
  return (!known && n === id) ? 'Medication (removed)' : n;
}

function exportDetailFor(e) {
  if (!e) return '';
  if (e.medId === 'temp') return e.dose || (e.temp !== undefined ? e.temp + tempSuffix() : '');
  if (e.medId === 'weight') return e.dose || (e.weight !== undefined ? e.weight + ' lbs' : '');
  if (e.medId === 'paracentesis') return e.cancelled ? 'Removed' : (e.liters !== undefined ? (Math.round(Number(e.liters) * 10) / 10).toFixed(1) + ' L drained' : (e.dose || ''));
  if (e.medId === 'bowel_movement') return BOWEL_MOVEMENT_LABELS[e.value] || e.dose || e.value || '';
  if (e.medId === 'appetite') return APPETITE_LABELS[e.value] || e.dose || e.value || '';
  if (e.medId === 'chemo_date') return e.dose || 'Chemo date';
  let d = e.dose || '';
  // Tylenol Liquid records volume separately from the dose label on some entries.
  if (e.volumeMl && d.indexOf('mL') < 0) d += (d ? ', ' : '') + e.volumeMl + ' mL';
  if (e.pills && !/pill/i.test(d)) d += (d ? ', ' : '') + e.pills + (e.pills === 1 ? ' pill' : ' pills');
  if (e.freq) d += (d ? ', ' : '') + e.freq + (e.freq === 1 ? ' episode' : ' episodes');
  if (e.painLevel) d += (d ? ', ' : '') + 'pain ' + e.painLevel + '/10';
  // WEB-MAIN records an override as the boolean `override: true` -- it has no `overrideReason`
  // field at all. Reading overrideReason here (as the phone app's exporter does) would silently
  // drop every early dose from her backup.
  if (e.override) d += (d ? ', ' : '') + 'taken early (override)';
  if (e.missed) d += (d ? ', ' : '') + 'not logged' + (e.windowName ? ' (' + e.windowName + ' window)' : '');
  return d;
}

// Missed doses are NOT documents. missedDosesFor() computes them at render time from the medication
// schedule configured ON THIS DEVICE, so two devices can produce different missed sets from
// byte-identical Firestore. Including them unmarked would make the backup lie; omitting them loses
// real clinical signal. They are included and marked `derived`, which keeps the file honest and
// lets any future restore filter to `logged` only.
function derivedMissedEntries(now) {
  const out = [];
  const end = dayStart(now);
  // DST-SAFE STEP -- the same idiom renderToday uses, so the export's missed set and the on-screen
  // banner stay in agreement. A flat += 86400000 drifts off local midnight across both DST
  // transitions: it emitted 1 Nov twice and dropped the current day entirely from 2 Nov onward.
  // 36h re-normalised through dayStart() always lands on the next local midnight.
  //
  // The stated justification for the old idiom did not hold anyway: renderToday filters by
  // state.missedClearedAt and the export does not, so with Clear pressed the banner showed 22
  // misses while the CSV carried 165. That divergence is deliberate and is stated in the report
  // caveat; the DST drift was not.
  for (let d = dayStart(MISSED_TRACK_SINCE); d <= end; d = dayStart(d + 129600000)) {
    missedDosesFor(d, now).forEach(m => out.push({ ...m, __derived: true }));
  }
  return out;
}

function buildExportRows(now) {
  // Logged documents first (chronologically), then derived rows (chronologically). Strict
  // chronology put ~40 consecutive "not logged" rows at the top of the file, so the artifact the
  // card calls "your backup" opened looking like a file about failures. The Source column and the
  // Timestamp column both survive, so nothing is lost for a restore or for re-sorting in Excel.
  // .concat() allocates, so this .sort() never touches a live state array.
  const rows = allExportEntries().concat(derivedMissedEntries(now))
    .sort((a, b) => ((a.__derived ? 1 : 0) - (b.__derived ? 1 : 0)) || (exportSortTs(a) - exportSortTs(b)));
  return rows.map(e => {
    const cleared = e.medId === 'chemo_date' && !e.ts;
    const rawTs = exportSortTs(e);
    const ts = (typeof rawTs === 'number' && isFinite(rawTs)) ? rawTs : 0;
    // Two separate reasons a row has no event time, and BOTH must blank the date columns.
    //  - `cleared`: a ts:0 chemo tombstone. exportSortTs substitutes loggedAt so it sorts sensibly,
    //    but loggedAt is when the clear was recorded, not when anything happened -- printing it as
    //    the event time is a lie, and it is what let the tombstone through the report's `!r[2]`
    //    guard and into the clinical hand-off as a blank-time row labelled "chemo_date".
    //  - `!ts`: a corrupt document carrying 0, NaN or Infinity. Only the first case was handled, so
    //    the others printed the epoch as "12/31/1969", or the literal string "Invalid Date".
    //    isFinite is load-bearing for Infinity specifically: !NaN is already true, but Infinity is
    //    truthy and reaches new Date(Infinity).toISOString(), which throws and kills the export.
    const undated = cleared || !ts;
    const dt = new Date(ts);
    return [
      undated ? '' : dt.toLocaleDateString(),
      undated ? '' : fmtTime(ts),
      undated ? '' : dt.toISOString(),
      // A derived row belongs to the medication window it was inferred from, not to whatever
      // bucket its clock time lands in -- those disagreed on 32 rows of a single export
      // ("Evening" beside "not logged (Night window)" on the same row).
      undated ? '' : (e.__derived && e.windowName ? e.windowName : timeBucket(ts)),
      nameOf(e.medId),
      e.medId || '',
      exportDetailFor(e),
      (e.mg === 0 || e.mg) ? e.mg : '',
      e.note || '',
      e.__derived ? 'derived' : 'logged',
      e.id || '',
      // The audit trail. An undated row blanks its four event-time columns because it has no event
      // time -- but the backup must still be able to say WHEN the chemo date was cleared, or the
      // trail is no longer reconstructable from the file.
      (typeof e.loggedAt === 'number' && isFinite(e.loggedAt) && e.loggedAt) ? new Date(e.loggedAt).toISOString() : ''
    ];
  });
}

const EXPORT_COLUMNS = ['Date', 'Time', 'Timestamp', 'Time of day', 'Type', 'Med ID', 'Detail', 'Amount (mg)', 'Note', 'Source', 'Entry ID', 'Logged at'];

function exportFilename(kind, ext) {
  const d = new Date(simNow());
  const stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const who = String(CONFIG.patientName || 'record').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'record';
  return who + '-' + kind + '-' + stamp + '.' + ext;
}

// Plain browser download. No native bridge here -- WEB-MAIN is a web app, so this is the whole path.
// Returns { method: 'share'|'download', cancelled: boolean }.
// The caller MUST use this. Announcing "saved" after a cancelled share is the same lie this
// function existed to tell for six releases.
async function deliverFile(blob, filename) {
  // THE iOS PWA PROBLEM, confirmed live on 2026-08-21: in an installed PWA (standalone display
  // mode) `<a download>` does not save anything. Safari ignores it or opens the blob in a viewer
  // with no route to Files. Every export produced a success toast and no file. The Web Share API
  // (Level 2, iOS Safari 15+) is the only reliable route -- the share sheet has "Save to Files".
  try {
    if (typeof File === 'function' && navigator.canShare) {
      const file = new File([blob], filename, { type: blob.type || 'application/octet-stream' });
      if (navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: filename });
          return { method: 'share', cancelled: false };
        } catch (err) {
          // AbortError means she tapped Cancel. That is not a failure and must not be retried as
          // a download -- a file appearing after she cancelled is its own kind of wrong.
          if (err && (err.name === 'AbortError' || err.name === 'NotAllowedError')) {
            return { method: 'share', cancelled: true };
          }
          // Anything else: fall through and try the download route rather than losing the export.
          console.warn('[export] share failed, falling back to download:', err);
        }
      }
    }
  } catch (err) {
    console.warn('[export] share unavailable, using download:', err);
  }

  const url = URL.createObjectURL(blob);
  try {
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  } finally {
    // Revoke on a timer, not immediately: Safari cancels an in-flight download if the object URL
    // is revoked in the same tick as the click.
    setTimeout(() => { try { URL.revokeObjectURL(url); } catch (err) {} }, 4000);
  }
  return { method: 'download', cancelled: false };
}

// One place that turns a deliverFile() result into words. "Saved to your downloads" is wrong for a
// share sheet (she chose where it went) and a lie if she cancelled.
function deliveredWord(res, what) {
  if (res && res.cancelled) return null;
  if (res && res.method === 'share') return what + ' — choose "Save to Files" to keep it.';
  return what + ' saved to your downloads.';
}

// The busy state is set, then a frame is yielded, THEN the work runs. Without the yield the whole
// export completed inside one synchronous task -- measured at 0 painted frames out of 70 -- so the
// spinner existed in the DOM and was never once shown to the user. The cost is not free and grows
// with the calendar, because derivedMissedEntries walks every day since MISSED_TRACK_SINCE.
function yieldFrame() {
  // Raced against a timer. requestAnimationFrame does not fire in a backgrounded tab, and iOS
  // Safari starves it aggressively -- without the race, backgrounding the app mid-export left
  // state.exporting stuck and BOTH buttons dead until the tab was focused again. Whichever
  // settles first wins; the work runs either way.
  return new Promise(r => {
    if (typeof requestAnimationFrame !== 'function') return setTimeout(r, 0);
    let done = false;
    const go = () => { if (!done) { done = true; r(); } };
    setTimeout(go, 250);
    requestAnimationFrame(() => requestAnimationFrame(go));
  });
}

async function downloadEntriesCSV() {
  if (state.exporting) return;
  setState({ exporting: 'csv' });
  try {
    await yieldFrame();
    const rows = buildExportRows(state.now);
    // Count only what she actually logged. rows includes derived missed-dose rows, so the old
    // count read "182 entries saved" against 21 real documents -- and "166 entries saved" on an
    // account with nothing in it at all, four cards below a card reading "0 recorded entries".
    const nLogged = rows.filter(r => r[9] === 'logged').length;
    if (!nLogged) {
      setToast('Nothing logged yet — there is nothing to save.');
      return;
    }
    const csv = [EXPORT_COLUMNS].concat(rows).map(r => r.map(csvField).join(',')).join('\r\n');
    // UTF-8 BOM so Excel opens °F, é and em-dashes correctly instead of as mojibake.
    const csvRes = await deliverFile(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }), exportFilename('records', 'csv'));
    const csvWord = deliveredWord(csvRes, nLogged + ' entr' + (nLogged === 1 ? 'y' : 'ies'));
    if (csvWord) setToast(csvWord);
  } catch (err) {
    // err.message here is a raw browser string -- "The operation is insecure.",
    // "QuotaExceededError". None of it is actionable, and all of it reads like the app broke in a
    // way that might have damaged her records. The technical detail goes to the console.
    console.error('[export:csv]', err);
    setToast("Couldn't save the file. Your records are safe — please try again.");
  } finally {
    setState({ exporting: false });
  }
}

// The printable report. Delivered as a downloadable .html file AND opened for printing where the
// browser allows it -- WEB-MAIN runs as an installed standalone PWA, where window.open is
// unreliable, and a toast telling her to reconfigure her browser is not an acceptable outcome for
// the one document she means to hand a doctor.
function buildReportDoc(now) {
  const rows = buildExportRows(now);
  const logged = rows.filter(r => r[9] === 'logged');
  const derived = rows.filter(r => r[9] === 'derived');
  // The period is what has been RECORDED, so a chemo date scheduled for next week must not stretch
  // it into the future -- "Jul 12 - Aug 18" on a record generated on Aug 14 reads as though there
  // is data that does not exist. Future-dated rows are surfaced in the header instead.
  //
  // ...and it must be computed from LOGGED rows only. Derived rows always start at
  // MISSED_TRACK_SINCE, so filtering `rows` pinned the period start to 12 Jul regardless of what
  // was recorded. Both ends of the range are guarded now, not one. .filter() allocates, so this
  // .sort() never touches a live state array.
  const dated = rows.filter(r => r[9] === 'logged' && r[2] && new Date(r[2]).getTime() <= now)
    .sort((a, b) => new Date(a[2]) - new Date(b[2]));
  const first = dated.length ? new Date(dated[0][2]) : null;
  const last = dated.length ? new Date(dated[dated.length - 1][2]) : null;
  const fmtD = (d) => d ? d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '—';

  const temps = allExportEntries().filter(e => e.medId === 'temp' && e.temp !== undefined).map(e => Number(e.temp)).filter(n => !isNaN(n));
  const weights = allExportEntries().filter(e => e.medId === 'weight' && e.weight !== undefined).map(e => Number(e.weight)).filter(n => !isNaN(n));
  const peakTemp = temps.length ? Math.max.apply(null, temps).toFixed(1) + tempSuffix() : '—';
  const netWeight = weights.length > 1 ? ((weights[weights.length - 1] - weights[0] >= 0 ? '+' : '') + (weights[weights.length - 1] - weights[0]).toFixed(1) + ' lbs') : '—';

  // Doses per medication -- the first thing an oncologist actually scans.
  const totals = {};
  allExportEntries().forEach(e => {
    if (!e.medId || e.medId === 'chemo_date') return;
    if (['temp', 'weight', 'paracentesis', 'appetite', 'bowel_movement', 'cycle_start', 'cycle_end', 'inpatient', 'inpatient_start', 'inpatient_end'].indexOf(e.medId) >= 0) return;
    if (e.medId.indexOf('symptom_') === 0) return;
    totals[e.medId] = (totals[e.medId] || 0) + 1;
  });
  const totalRows = Object.keys(totals).sort((a, b) => totals[b] - totals[a])
    .map(id => '<tr><td>' + escHtml(reportNameOf(id)) + '</td><td class="num">' + totals[id] + '</td></tr>').join('');

  // A usable event time, or nothing. The blanking rule that buildExportRows applies to every row
  // has to hold here too: this table is inside the document handed to an oncologist, and without
  // the guard a corrupt document printed "Invalid Date", and a ts:0 printed "Dec 31, 1969".
  const usableTs = (v) => (typeof v === 'number' && isFinite(v) && v > 0) ? v : 0;
  const symptoms = allExportEntries().filter(e => e.medId && e.medId.indexOf('symptom_') === 0)
    .sort((a, b) => usableTs(a.ts) - usableTs(b.ts))
    .map(e => { const ts = usableTs(e.ts); return '<tr><td>' + escHtml(ts ? fmtD(new Date(ts)) : '') + '</td><td>' + escHtml(ts ? fmtTime(ts) : '') + '</td><td>' + escHtml(nameOf(e.medId)) + '</td><td>' + escHtml(e.note || exportDetailFor(e)) + '</td></tr>'; }).join('');

  // SUMMARISED, not enumerated. Rendered against a realistic span this section produced ~165 rows
  // of "not logged" and pushed the daily log -- what she actually took and how she felt -- off the
  // first several pages. A clinician needs the shape of the adherence problem, not every instance.
  // The CSV keeps every individual row; that is the backup. This is the communication.
  // ...and it is suppressed entirely when nothing was logged. With zero documents the whole body of
  // the document was a bold red table reading "166 scheduled doses with nothing logged", beside an
  // ENTRIES tile reading 0 -- a page of accusations derived purely from non-events. That is what
  // the document looked like after a reinstall, after a device change, or during any stretch she
  // was too sick to log. A derived-only document is never emitted.
  const missedBy = {};
  (logged.length ? derived : []).forEach(r => {
    const k = r[5] || r[4];
    const t = r[2] ? new Date(r[2]).getTime() : 0;
    const g = missedBy[k] || (missedBy[k] = { n: 0, first: Infinity, last: 0 });
    g.n++; if (t && t < g.first) g.first = t; if (t > g.last) g.last = t;
  });
  const missedRows = Object.keys(missedBy).sort((a, b) => missedBy[b].n - missedBy[a].n).map(k => {
    const g = missedBy[k];
    const span = (g.first === Infinity) ? '—' : (fmtD(new Date(g.first)) + ' – ' + fmtD(new Date(g.last)));
    return '<tr class="missed"><td>' + escHtml(reportNameOf(k)) + '</td><td class="num">' + g.n + '</td><td>' + escHtml(span) + '</td></tr>';
  }).join('');
  const missedTotal = logged.length ? derived.length : 0;

  // Daily log. Cleared-chemo tombstones and future-dated chemo dates are kept out of the day
  // grouping -- the first is audit trail, the second would render a future day at the top of a
  // record of what has happened.
  const byDay = {}, dayTs = {};
  logged.forEach(r => {
    if (!r[2]) return;
    // This `!r[2]` guard is what keeps the cleared-chemo tombstone out of the clinical hand-off.
    // In v43 it did not, because exportSortTs substitutes loggedAt for the zero ts and
    // buildExportRows populated the Timestamp column from it, so the row sailed through and printed
    // as a blank-time row labelled "chemo_date". buildExportRows now blanks all four date columns
    // for an undated row, which closes it at the source. A second explicit skip here was tried and
    // removed -- nothing could make it fire, so it was dead code, not defence in depth.
    const t = new Date(r[2]).getTime();
    if (r[5] === 'chemo_date' && t > now) return;
    const key = new Date(r[2]).toLocaleDateString();
    if (!byDay[key]) { byDay[key] = []; dayTs[key] = dayStart(t); }
    byDay[key].push(r);
  });
  // Sorted and labelled from the real timestamp, NEVER by re-parsing the locale-formatted grouping
  // key. new Date("13/08/2026") is 8 December under en-GB and Invalid Date under ar-EG, so
  // round-tripping the key mislabelled every heading and scrambled the day order outside en-US.
  // The key has to stay a string to group on; the timestamp is carried alongside it.
  const dayKeys = Object.keys(byDay).sort((a, b) => dayTs[b] - dayTs[a]);
  // Day headings carry the weekday -- it is what a clinician anchors on when scanning a log --
  // while every other date in the document goes through fmtD. Two formats, each with a reason,
  // rather than the four this document carried by accident.
  const dayLabel = (k) => new Date(dayTs[k]).toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
  // The date lives INSIDE each day table's thead rather than in a preceding <h3>. thead is
  // display:table-header-group, so it repeats on every page the day spans. Previously the column
  // header repeated but the date did not, so page 2 opened with five rows and no way for a
  // clinician to tell what day they belonged to -- and it looked complete while being wrong.
  const dayTables = dayKeys.map(k =>
    '<table class="log"><thead><tr><th colspan="4" class="dayhdr">' + escHtml(dayLabel(k)) + '</th></tr>' +
    '<tr><th>Time</th><th>Type</th><th>Detail</th><th>Note</th></tr></thead><tbody>' +
    byDay[k].map(r => '<tr><td>' + escHtml(r[1]) + '</td><td>' + escHtml(reportNameOf(r[5]) || r[4]) + '</td><td>' + escHtml(r[6]) + '</td><td>' + escHtml(r[8]) + '</td></tr>').join('') +
    '</tbody></table>').join('');

  const nextTs = (typeof nextChemoTs === 'function') ? nextChemoTs() : null;

  return '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Treatment record — ' + escHtml(CONFIG.patientName) + '</title><style>' +
    // Running header/footer via @page margin boxes. Without them a page separated from the set
    // carried no date, no patient name and no page number, and the "not a clinical document"
    // disclaimer rendered once at the very end, so a clinician handed only page 1 never saw it.
    //
    // UNVERIFIED ON iOS. Chromium honours @page margin boxes -- measured, the footer appears on all
    // pages of a page-spanning report. WebKit historically does NOT, and Brandi prints from an
    // iPhone. If Safari ignores this block it degrades SILENTLY back to the original defect. The
    // downside is bounded, deliberately: each day's DATE lives in its table's thead
    // (display:table-header-group, which WebKit does honour), so every page keeps the date of the
    // rows on it either way. Only the patient name and the page numbers are at risk. Do not record
    // this as "fixed on iOS" until someone has looked at page 2 in iOS Safari's print preview.
    '@page{size:letter;margin:16mm 13mm 18mm;' +
      '@bottom-right{content:"' + cssStr(CONFIG.patientName) + ' · treatment record · page " counter(page) " of " counter(pages);font-size:8.5pt;color:#6E5261}' +
      '@bottom-left{content:"Patient-logged record — verify against medical records";font-size:8.5pt;color:#6E5261}}' +
    'body{font:11.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#2A2127;margin:0;padding:18px;-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
    'h1{font-size:19px;margin:0 0 2px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#8E3D61;margin:22px 0 6px;border-bottom:1px solid #E9D8D1;padding-bottom:4px}' +
    'h3{font-size:12px;margin:14px 0 4px;background:#F6E9EE;padding:4px 7px;border-radius:4px;break-after:avoid}' +
    'table.log{margin:14px 0 0}th.dayhdr{background:#F6E9EE;text-align:left;font-size:12px;color:#2A2127;letter-spacing:0;text-transform:none;padding:5px 7px;border-bottom:none}' +
    '.sub{color:#6E5261;font-size:11px}' +
    '.tiles{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}' +
    '.card{flex:1;min-width:110px;border:1px solid #E9D8D1;border-radius:7px;padding:7px 9px;break-inside:avoid}' +
    '.card b{display:block;font-size:15px}.card span{font-size:10px;color:#6E5261;text-transform:uppercase;letter-spacing:.05em}' +
    '.card.period{flex:1.6}.card.period b{font-size:15px;line-height:1.15}' +
    'table{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}' +
    'th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#8E3D61;border-bottom:1px solid #E9D8D1;padding:3px 5px}' +
    'td{padding:3px 5px;border-bottom:1px solid #F3EAEA;vertical-align:top;word-wrap:break-word}' +
    'thead{display:table-header-group}tr{break-inside:avoid}' +
    'table.log td:nth-child(1),table.log th:nth-child(1){width:62px}table.log td:nth-child(2),table.log th:nth-child(2){width:120px}table.log td:nth-child(4),table.log th:nth-child(4){width:30%}' +
    // Demoted from #A5443C/700. Red bold made a table of CALCULATED non-events the loudest thing
    // on page 1, outranking the daily log -- what she actually took and how she felt. The section
    // says of itself that these are "not necessarily a dose that was actually skipped"; it must
    // not be styled like a finding. 400, not 600: at 600 it was still the heaviest body text on
    // the page while every other table cell was 400.
    '.missed td{color:#5B4A53;font-weight:400}' +
    'td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}' +
    '.chip{display:inline-block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:#F6E9EE;color:#8E3D61;border-radius:4px;padding:1px 5px;vertical-align:middle}' +
    '.lead{font-size:11.5px;color:#2A2127;margin:6px 0 6px;max-width:78ch}' +
    '.nextdate{font-size:12px;color:#2A2127;margin-top:3px}.nextdate b{color:#8E3D61}' +
    '.caveat{font-size:10.5px;color:#6E5261;margin:4px 0 8px}' +
    'footer{margin-top:26px;padding-top:8px;border-top:1px solid #E9D8D1;font-size:10px;color:#6E5261}' +
    '</style></head><body>' +
    '<h1>Treatment record — ' + escHtml(CONFIG.patientName) + '</h1>' +
    '<div class="sub">Patient-logged record · CareTracker ' + escHtml(APP_VERSION) + ' · generated ' + escHtml(fmtD(new Date(simNow())) + ', ' + fmtTime(simNow())) + '</div>' +
    (nextTs ? '<div class="nextdate">Next treatment date: <b>' + escHtml(fmtD(new Date(nextTs))) + '</b></div>' : '') +
    '<h2>Summary</h2><div class="tiles">' +
    '<div class="card period"><span>Period</span><b>' + escHtml(fmtD(first)) + ' – ' + escHtml(fmtD(last)) + '</b></div>' +
    '<div class="card"><span>Entries</span><b>' + logged.length + '</b></div>' +
    '<div class="card"><span>Peak temperature</span><b>' + escHtml(peakTemp) + '</b></div>' +
    '<div class="card"><span>Net weight change</span><b>' + escHtml(netWeight) + '</b></div>' +
    '</div>' +
    (totalRows ? '<h2>Doses recorded, by medication</h2><table><thead><tr><th>Medication</th><th class="num" style="width:90px">Doses</th></tr></thead><tbody>' + totalRows + '</tbody></table>' : '') +
    (symptoms ? '<h2>Symptoms reported</h2><table><thead><tr><th style="width:80px">Date</th><th style="width:62px">Time</th><th style="width:130px">Symptom</th><th>Description</th></tr></thead><tbody>' + symptoms + '</tbody></table>' : '') +
    // Order matters: the daily log is a record of what happened and leads the document. The
    // calculated section follows it. Demoting the colour and weight was not enough while a table
    // of inferred non-events still occupied page 1 above the entries she actually made.
    '<h2>Daily log</h2>' + (dayTables || '<div class="lead">No entries were recorded in this period.</div>') +
    // N-1: the daily log runs newest-first (a clinician opens on the most recent day) while the CSV
    // runs oldest-first (a backup reads as a timeline). Two artifacts, two jobs, deliberate.
    //
    // The heading was renamed from "Missed scheduled doses", which asserted exactly what the caveat
    // underneath it then retracted. The lead sentence is body size and sits directly under the
    // heading, where the old 10.5px grey caveat read as fine print beneath a headline.
    (missedRows ? '<h2>Scheduled doses with nothing logged <span class="chip">calculated</span></h2>' +
      '<div class="lead">These are calculated from the medication schedule saved on this device, not entries ' + escHtml(CONFIG.patientName) + ' made. They are not confirmed missed doses.</div>' +
      '<div class="caveat">' + missedTotal + ' scheduled dose' + (missedTotal === 1 ? '' : 's') + ' had nothing logged against ' + (missedTotal === 1 ? 'it' : 'them') + ', summarised by medication. Tracking begins ' + escHtml(fmtD(new Date(MISSED_TRACK_SINCE))) + '; an absence of flags before that date does not mean no doses were missed. Every individual occurrence is listed in the spreadsheet export.</div>' +
      '<table><thead><tr><th>Medication</th><th class="num" style="width:110px">Not logged</th><th style="width:190px">Date range</th></tr></thead><tbody>' + missedRows + '</tbody></table>' +
      // Patient-recorded reasons, in their own labelled subsection UNDER the calculated table and
      // never mixed into it. "Three missed doses, all nausea" is worth a great deal to an
      // oncologist; three blank rows are worth nothing. It shares this section's suppression rule,
      // so it cannot appear in a report that has no logged entries behind it.
      mrReportBlock(derived) : '') +
    '<footer>This is a patient-logged record, not a clinical document — please verify against medical records before relying on it. Times shown are the local time of the device at the moment each entry was logged.</footer>' +
    '</body></html>';
}

async function openPrintReport() {
  if (state.exporting) return;
  setState({ exporting: 'report' });
  try {
    await yieldFrame();
    if (!buildExportRows(state.now).some(r => r[9] === 'logged')) {
      setToast('Nothing logged yet — there is nothing to report.');
      return;
    }
    const doc = buildReportDoc(state.now);
    // Always give her the file: an installed PWA can block window.open, and a downloaded .html can
    // be opened and printed from anywhere.
    await deliverFile(new Blob([doc], { type: 'text/html;charset=utf-8' }), exportFilename('report', 'html'));
    let opened = null;
    try { opened = window.open('', '_blank'); } catch (err) { opened = null; }
    if (opened && opened.document) {
      opened.document.write(doc);
      opened.document.close();
      setTimeout(() => { try { opened.focus(); opened.print(); } catch (err) {} }, 350);
      setToast('Report saved and opened for printing.');
    } else {
      setToast('Report saved. Open it from Downloads to print.');
    }
  } catch (err) {
    console.error('[export:report]', err);
    setToast("Couldn't build the report. Your records are safe — please try again.");
  } finally {
    setState({ exporting: false });
  }
}


// =================================================================================================
// BACKUP & RESTORE
//
// WHY THIS EXISTS. "Save a copy" produced two files and NEITHER of them could be put back. The
// spreadsheet is a report ABOUT the data, not the data: twelve display columns, no way to tell a
// document from a derived missed-dose row, and appointments deliberately absent. The printable
// report is HTML for an oncologist. If this phone is lost, or the Firestore project is emptied,
// neither file restores a single record. This block is the file that does.
//
// WHAT IT READS, AND WHY IT DOES NOT GO THROUGH allExportEntries(). subscribeEntries() fans one
// snapshot out into state.entries, state.chemoDates, state.appointments and state.missReasons, and
// the last two are then COLLAPSED to their live versions with the superseded history thrown away.
// Every one of those splits is right for the screen and wrong for a backup. getDocs(col) reads the
// collection itself, so appointment edit history and missed-dose reason documents are all captured
// as written. It also has a second property that matters more than convenience: allExportEntries()
// is not touched. That one function is the seam that keeps appointments and reason documents out
// of the spreadsheet and out of the record handed to a doctor. A backup routed through it would
// have had to widen it, and the leak would have been one careless edit away forever after.
//
// WHAT IT WRITES ON RESTORE. setDoc(doc(db, COL_NAME, <the document's original id>), fields).
// That is a CREATE at a known id, which is an append under append-only rules -- no updateDoc, no
// deleteDoc, nothing removed. Consequences, all deliberate:
//   * document ids are preserved, so a record restored twice is the same record, not a duplicate;
//   * restore is IDEMPOTENT -- importing the same file a second time adds nothing;
//   * an id already present on this phone is SKIPPED, never written over. If both phones have the
//     record, the one already here wins, because it is the one Firestore has been serving.
// The only write that is not a create is the prefs high-water mark, and it only ever moves
// forward; see bkRestorePrefs().
// =================================================================================================

const BK_FORMAT = 'care-tracker-backup';
const BK_FORMAT_VERSION = 1;
// A guard on the file picker, not on the export. Whole-of-history for this patient is a few
// hundred kB; anything past 40 MB is somebody having selected a video, and JSON.parse on it would
// lock the phone up before it failed.
const BK_MAX_BYTES = 40 * 1024 * 1024;

// Canonical JSON: object keys sorted at every depth, document arrays sorted by document id. The
// same set of records therefore always serialises to the same BYTES, whatever order Firestore
// handed them back in and whatever order the fields happen to sit in on any given document. That
// is what makes "export, empty the database, import, export again, compare the md5" an actual
// test of the round trip instead of a field-by-field opinion about it.
function bkCanonical(v) {
  if (Array.isArray(v)) return v.map(bkCanonical);
  if (v && typeof v === 'object') {
    const out = {};
    Object.keys(v).sort().forEach((k) => { out[k] = bkCanonical(v[k]); });
    return out;
  }
  // JSON has no NaN and no Infinity: JSON.stringify silently emits `null` for both. Doing it here
  // instead means the value that comes back out of a restored file is the same value that went in,
  // so a corrupt ts does not change shape between one export and the next.
  if (typeof v === 'number' && !isFinite(v)) return null;
  return v;
}

function bkById(a, b) {
  const x = String((a && a.id) || '');
  const y = String((b && b.id) || '');
  return x < y ? -1 : x > y ? 1 : 0;
}

// Firestore's own rules for a document id. An id that breaks one of these cannot be written, so it
// is counted and reported rather than thrown at setDoc to fail one at a time.
// `__.*__` is reserved by Firestore -- which is also why '__proto__' can never arrive here as an
// id, and why the membership map below is still Object.create(null): 'constructor', 'toString',
// 'valueOf' and 'hasOwnProperty' are all perfectly legal Firestore document ids.
function bkValidDocId(id) {
  if (typeof id !== 'string') return false;
  if (!id.length || id.length > 1500) return false;
  if (id.indexOf('/') >= 0) return false;
  if (id === '.' || id === '..') return false;
  if (/^__.*__$/.test(id)) return false;
  return true;
}

function bkHasAnything() {
  return (state.entries || []).length > 0 || (state.chemoDates || []).length > 0 || (state.appointments || []).length > 0;
}

// Read everything, as written. The document id is applied LAST so that identity always wins: a
// document carrying its own field called `id` would otherwise overwrite the thing needed to put it
// back. (No document this app writes has such a field; this is about a file that arrives later.)
async function bkCollect() {
  const snap = await getDocs(col);
  const docs = snap.docs.map((d) => Object.assign({}, d.data(), { id: d.id }));
  const appointments = docs.filter((d) => d.medId === CAL_APPT_MED_ID).sort(bkById);
  const entries = docs.filter((d) => d.medId !== CAL_APPT_MED_ID).sort(bkById);
  // Preferences are one small document in a different collection. A failure to read them must not
  // cost the entries their backup, so it is caught here and the section is simply absent.
  let prefs = null;
  try {
    const psnap = await getDocs(collection(db, PREFS_COL_NAME));
    psnap.docs.forEach((d) => { if (d.id === 'settings') prefs = d.data(); });
  } catch (err) {
    console.error('[backup:prefs]', err);
  }
  return { entries: entries, appointments: appointments, prefs: prefs };
}

// The medication list is device-local (localStorage), not a Firestore document, so it is read from
// state rather than from the collection. archivedMeds is the load-bearing half: every dose ever
// logged against a medication that has since been removed is still a real document in
// caretracker_entries and still restores, but WITHOUT the archived name those rows come back as a
// bare id and the printable record reads "Medication (removed)" where a drug name belongs.
function bkBuildPayload(bundle, atMs) {
  return bkCanonical({
    format: BK_FORMAT,
    formatVersion: BK_FORMAT_VERSION,
    app: APP_VERSION,
    patient: String(CONFIG.patientName || ''),
    createdAt: atMs,
    entries: bundle.entries,
    // Its own section, not folded in with the entries. Two reasons: it makes the presence of
    // appointments in the file auditable at a glance, and it lets a file written BEFORE
    // appointments existed be recognised as complete rather than as damaged -- a missing section
    // means none, see bkReadIncoming().
    appointments: bundle.appointments,
    prefs: bundle.prefs,
    medications: { version: 1, meds: state.meds || [], archivedMeds: state.archivedMeds || {} }
  });
}

async function downloadBackupFile() {
  if (state.exporting || state.restoring) return;
  setState({ exporting: 'backup', backupNotice: null });
  try {
    await yieldFrame();
    const bundle = await bkCollect();
    const n = bundle.entries.length + bundle.appointments.length;
    if (!n) {
      setToast('Nothing to back up yet.');
      return;
    }
    const text = JSON.stringify(bkBuildPayload(bundle, simNow()), null, 2);
    await deliverFile(new Blob([text], { type: 'application/json' }), exportFilename('backup', 'json'));
    const nAppt = bundle.appointments.length;
    setState({
      backupNotice: {
        kind: 'ok',
        message: 'Backup saved — ' + n + ' record' + (n === 1 ? '' : 's') +
          (nAppt ? ', including ' + nAppt + ' appointment record' + (nAppt === 1 ? '' : 's') : '') +
          '. Check it landed in your Files app, then load it back here once to be sure it opens.'
      }
    });
    setToast(n + ' record' + (n === 1 ? '' : 's') + ' saved to your backup file.');
  } catch (err) {
    // The raw message is a browser string ("The operation is insecure.") that reads like the app
    // broke in a way that might have damaged her records. It goes to the console.
    console.error('[backup:save]', err);
    setState({ backupNotice: { kind: 'bad', message: "Couldn't make the backup file. Nothing was changed — please try again." } });
    setToast("Couldn't save the backup file. Your records are safe.");
  } finally {
    setState({ exporting: false });
  }
}

// ------------------------------------------------------------------------------------------------
// Restore
// ------------------------------------------------------------------------------------------------

function bkReadText(file) {
  if (file && typeof file.text === 'function') return file.text();
  // Older iOS Safari has no Blob.text(). Without this the restore button did nothing at all there.
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result || ''));
    r.onerror = () => reject(r.error || new Error('could not read the file'));
    r.readAsText(file);
  });
}

// Validate and flatten. Throws a short machine token; bkImportFile turns it into a sentence.
function bkReadIncoming(parsed) {
  if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('not-a-backup');
  if (parsed.format !== BK_FORMAT) throw new Error('not-a-backup');
  const fv = Number(parsed.formatVersion);
  if (!isFinite(fv) || fv < 1) throw new Error('not-a-backup');
  // A file from a NEWER build may carry sections this build does not understand. Importing the
  // parts it does recognise would look like a complete restore and quietly not be one.
  if (fv > BK_FORMAT_VERSION) throw new Error('newer-format');
  const records = [];
  const take = (arr) => {
    if (!Array.isArray(arr)) return;
    arr.forEach((r) => {
      if (r && typeof r === 'object' && !Array.isArray(r)) records.push(r);
    });
  };
  take(parsed.entries);
  // BACKWARD COMPATIBILITY, and the whole reason appointments sit in their own section: a backup
  // written before this existed has no `appointments` key at all. Absent means none, not broken.
  // Array.isArray() above is what makes `undefined` a no-op instead of a throw.
  take(parsed.appointments);
  return {
    records: records,
    prefs: (parsed.prefs && typeof parsed.prefs === 'object' && !Array.isArray(parsed.prefs)) ? parsed.prefs : null,
    medications: (parsed.medications && typeof parsed.medications === 'object' && !Array.isArray(parsed.medications)) ? parsed.medications : null
  };
}

async function bkRestore(bundle) {
  const snap = await getDocs(col);
  // Object.create(null). NEVER {}. These keys are Firestore document ids, and a document id is
  // free to be the string "constructor", "toString", "valueOf" or "hasOwnProperty" -- all four are
  // legal ids. Against a plain object literal the membership test `here[id]` is TRUTHY on an
  // EMPTY map, because it finds Object.prototype.constructor. Those records would have been
  // counted as "already on this phone", skipped, and never written, while the screen reported a
  // clean successful restore. Silent medical-record loss with a green tick on it. This is the
  // same class of bug v43.4 fixed in nameOf()/reportNameOf(), and export-test.mjs pins it.
  const here = Object.create(null);
  snap.docs.forEach((d) => { here[d.id] = 1; });

  const res = { added: 0, already: 0, unusable: 0, failed: 0, appointments: 0 };
  for (const rec of bundle.records) {
    const id = rec.id;
    if (!bkValidDocId(id)) { res.unusable++; continue; }
    if (here[id]) { res.already++; continue; }
    const fields = {};
    Object.keys(rec).forEach((k) => { if (k !== 'id') fields[k] = rec[k]; });
    try {
      // A create at a known id. Never updateDoc, never deleteDoc: the rules forbid both, and a
      // restore that could delete is not a restore.
      await setDoc(doc(db, COL_NAME, id), fields);
      here[id] = 1;
      res.added++;
      if (fields.medId === CAL_APPT_MED_ID) res.appointments++;
    } catch (err) {
      // One document failing must not abandon the other four hundred.
      console.error('[restore:doc]', id, err);
      res.failed++;
    }
  }
  return res;
}

// The medication list is per-device and the person holding this phone is the one who set it up, so
// it is NOT overwritten by a file. Two cases:
//   * this phone has never saved a configuration -- a new phone, which is the case restore exists
//     for -- so the backup's list is adopted whole;
//   * this phone has its own list, which is left alone. The one thing merged in either way is the
//     set of ARCHIVED names, because those are what stop a removed medication's restored dose
//     history from printing as a bare id in a document handed to an oncologist.
function bkRestoreMedications(medBlock) {
  const out = { mode: 'none', archivedAdded: 0 };
  if (!medBlock || typeof medBlock !== 'object') return out;
  const incomingMeds = Array.isArray(medBlock.meds) ? medBlock.meds : null;
  const incomingArchived = normalizeArchivedMeds(medBlock.archivedMeds);
  let hasLocal = true;
  try {
    hasLocal = (typeof localStorage !== 'undefined') && !!localStorage.getItem(MED_CONFIG_STORAGE_KEY);
  } catch (err) {
    // Storage unreadable (private mode, quota): assume there IS a local list rather than
    // clobbering whatever is in memory.
    hasLocal = true;
  }
  if (!hasLocal && incomingMeds && incomingMeds.length) {
    const meds = mergeMissingDefaultMeds(incomingMeds.map(normalizeMedication).map(migrateSenokotV37), incomingArchived);
    persistMedicationConfig(meds, incomingArchived);
    setState({ meds: meds, archivedMeds: incomingArchived });
    out.mode = 'restored';
    return out;
  }
  const archived = Object.assign({}, state.archivedMeds || {});
  const known = new Set((state.meds || []).map((m) => m.id));
  Object.keys(incomingArchived).forEach((id) => {
    if (known.has(id)) return;
    // hasOwnProperty, not a bare index -- `archived['constructor']` is truthy on an empty map and
    // would drop the archived name of a medication with an unlucky id. Same trap as `here` above.
    if (Object.prototype.hasOwnProperty.call(archived, id)) return;
    archived[id] = incomingArchived[id];
    out.archivedAdded++;
  });
  if (out.archivedAdded) {
    persistMedicationConfig(state.meds, archived);
    setState({ archivedMeds: archived });
    out.mode = 'merged';
  }
  return out;
}

// missedClearedAt is a HIGH-WATER MARK: the moment the missed-dose banner was last dismissed.
// Restoring an older value would resurface months of already-dismissed warnings on a phone that
// had moved past them, so it only ever moves forward. This is the one write in this block that is
// not a create, and it is the same setDoc(..., {merge:true}) the app already uses on this document.
async function bkRestorePrefs(prefs) {
  if (!prefs || typeof prefs !== 'object') return false;
  const incoming = Number(prefs.missedClearedAt);
  const current = Number(state.missedClearedAt) || 0;
  if (!isFinite(incoming) || incoming <= current) return false;
  await setDoc(PREFS_DOC, { missedClearedAt: incoming }, { merge: true });
  return true;
}

// The file input is created ONCE and appended to document.body -- NOT returned from render().
// render() does root.innerHTML = '' on every repaint and the clock tick repaints once a second, so
// an <input type="file"> living inside #root is destroyed while the operating system's file picker
// is still open. Its change event then fires on a node that is no longer in the document, the
// chosen file is dropped, and nothing anywhere reports a failure. Outside #root it survives every
// repaint, and no repaint guard has to be added to the tick to protect it.
let bkFileInput = null;

function bkEnsureFileInput() {
  if (bkFileInput && bkFileInput.isConnected) return bkFileInput;
  const el = document.createElement('input');
  el.type = 'file';
  el.accept = '.json,application/json';
  el.setAttribute('data-backup-file-input', 'true');
  // Off-screen rather than display:none: iOS Safari will not open a picker for a control it
  // considers unrendered.
  el.style.position = 'fixed';
  el.style.left = '-10000px';
  el.style.top = '0';
  el.style.width = '1px';
  el.style.height = '1px';
  el.style.opacity = '0';
  // 16px even though it is off-screen and never typed into: iOS Safari zooms the page in when a
  // focused field is under 16px and does not zoom back out, and a file input DOES take focus when
  // its picker opens. The one under-16px control on the page is not worth the risk of leaving the
  // app stuck at 1.3x with the nav off-screen.
  el.style.fontSize = '16px';
  el.addEventListener('change', () => {
    const f = el.files && el.files[0];
    // Cleared so that choosing the SAME file again still fires a change event. The File reference
    // is already held, so clearing here does not lose it.
    el.value = '';
    if (f) bkImportFile(f);
  });
  document.body.appendChild(el);
  bkFileInput = el;
  return el;
}

function bkPickFile() {
  if (state.restoring || state.exporting) return;
  try {
    bkEnsureFileInput().click();
  } catch (err) {
    console.error('[restore:pick]', err);
    setState({ backupNotice: { kind: 'bad', message: "This phone wouldn't open the file picker. Nothing was changed." } });
  }
}

async function bkImportFile(file) {
  if (state.restoring || state.exporting) return;
  setState({ restoring: true, backupNotice: null });
  try {
    if (file && typeof file.size === 'number' && file.size > BK_MAX_BYTES) {
      setState({ backupNotice: { kind: 'bad', message: "That file is far too big to be a CareTracker backup. Nothing was changed." } });
      return;
    }
    let text = '';
    try {
      text = await bkReadText(file);
    } catch (err) {
      console.error('[restore:read]', err);
      setState({ backupNotice: { kind: 'bad', message: "Couldn't read that file. Nothing was changed — try choosing it again." } });
      return;
    }
    let parsed = null;
    try {
      parsed = JSON.parse(text);
    } catch (err) {
      setState({ backupNotice: { kind: 'bad', message: "That doesn't look like a CareTracker backup. Choose the file whose name ends in .json — the spreadsheet and the printable report can't be loaded back." } });
      return;
    }
    let bundle = null;
    try {
      bundle = bkReadIncoming(parsed);
    } catch (err) {
      const msg = (err && err.message === 'newer-format')
        ? 'This backup was made by a newer version of CareTracker than the one on this phone. Update the app first — loading it here could leave part of it out without saying so.'
        : "That doesn't look like a CareTracker backup. Choose the file whose name ends in .json — the spreadsheet and the printable report can't be loaded back.";
      setState({ backupNotice: { kind: 'bad', message: msg } });
      return;
    }
    if (!bundle.records.length && !bundle.medications) {
      setState({ backupNotice: { kind: 'bad', message: 'That backup file is empty. Nothing was changed.' } });
      return;
    }

    const res = await bkRestore(bundle);
    const med = bkRestoreMedications(bundle.medications);
    let prefsMoved = false;
    try {
      prefsMoved = await bkRestorePrefs(bundle.prefs);
    } catch (err) {
      // Settings are not records. Failing to move the high-water mark is worth a console line and
      // nothing else; the records are already in.
      console.error('[restore:prefs]', err);
    }

    // Every number here is counted from what actually happened, not from what was attempted.
    const bits = [];
    bits.push(res.added === 0
      ? 'Nothing new to add — everything in that file was already on this phone.'
      : ('Restored ' + res.added + ' record' + (res.added === 1 ? '' : 's') +
         (res.appointments ? ', including ' + res.appointments + ' appointment record' + (res.appointments === 1 ? '' : 's') : '') + '.'));
    if (res.already) bits.push(res.already + ' ' + (res.already === 1 ? 'was' : 'were') + ' already here and ' + (res.already === 1 ? 'was' : 'were') + ' left alone.');
    if (med.mode === 'restored') bits.push('Your medication list came back too.');
    else if (med.archivedAdded) bits.push('Added ' + med.archivedAdded + ' medication name' + (med.archivedAdded === 1 ? '' : 's') + ' so older doses still read properly.');
    if (prefsMoved) bits.push('Your settings were brought forward.');
    if (res.unusable) bits.push(res.unusable + ' ' + (res.unusable === 1 ? 'line' : 'lines') + " in the file couldn't be read and " + (res.unusable === 1 ? 'was' : 'were') + ' left out.');
    if (res.failed) bits.push(res.failed + ' ' + (res.failed === 1 ? "couldn't" : "couldn't") + ' be written — check your connection and load the file again; loading it twice is safe.');
    bits.push('Nothing was removed.');

    setState({ backupNotice: { kind: (res.failed || res.unusable) ? 'bad' : 'ok', message: bits.join(' ') } });
    setToast(res.added ? ('Restored ' + res.added + ' record' + (res.added === 1 ? '' : 's') + '.') : 'Nothing new to restore.');
  } catch (err) {
    console.error('[restore]', err);
    setState({ backupNotice: { kind: 'bad', message: "Something went wrong loading that file. Nothing was removed. Please try again." } });
  } finally {
    setState({ restoring: false });
  }
}

// ------------------------------------------------------------------------------------------------
// Concurrent edit — "this changed while you had it open"
// ------------------------------------------------------------------------------------------------

// A stable fingerprint of the version of an appointment that is live RIGHT NOW. Document id and
// loggedAt alone would be enough for two copies of this app, but the visible fields are folded in
// as well so that a document written by anything else -- a repair script, a restore, a future
// build -- still registers as a change instead of slipping past on a matching timestamp.
function calApptStampFor(apptId) {
  const live = (state.appointments || []).find((a) => a.apptId === apptId);
  if (!live) return 'gone';
  return [String(live.id || ''), String(live.loggedAt || 0), String(live.ts || 0), String(live.title || ''), String(live.note || '')].join('|');
}

function calDetectApptConflict(s) {
  // A brand-new appointment has nothing to clash with. overwriteOk is set only by the person
  // pressing "Keep mine" on the notice, which is the informed choice this whole thing exists for.
  if (!s || !s.apptId || s.overwriteOk) return null;
  if (calApptStampFor(s.apptId) === s.baseStamp) return null;
  const live = (state.appointments || []).find((a) => a.apptId === s.apptId);
  if (!live) {
    return { kind: 'removed', message: 'Someone else removed this appointment from another phone while you had it open. Nothing has been saved yet.' };
  }
  const when = calIsValidTs(live.ts) ? (new Date(live.ts).toLocaleDateString() + ' at ' + fmtTime(live.ts)) : '';
  const note = String(live.note || '').trim();
  return {
    kind: 'changed',
    message: 'Someone else changed this appointment from another phone while you had it open. It now says “' + String(live.title || '') + '”' +
      (when ? ', ' + when : '') + (note ? ' — ' + note : '') + '. Nothing has been saved yet.',
    theirs: { title: String(live.title || ''), when: toLocalISO(live.ts), note: note }
  };
}

// "Keep mine" is the ONLY route to writing over the other phone's version, and it is reached by
// reading what the other version says and then pressing a button. Nothing here happens on its own.
function calKeepMine() {
  const c = state.apptSheet;
  if (!c || c.busy) return;
  c.overwriteOk = true;
  c.conflict = null;
  c.error = '';
  setState({ apptSheet: c });
  calSaveAppt();
}

function calUseTheirs() {
  const c = state.apptSheet;
  if (!c || c.busy || !c.conflict) return;
  if (c.conflict.kind === 'removed') {
    calSheetNeedsFocus = false;
    setState({ apptSheet: null, apptConfirmDelete: null });
    setToast('Left as removed. Nothing was changed.');
    return;
  }
  const t = c.conflict.theirs || {};
  c.title = String(t.title || '');
  c.when = String(t.when || c.when);
  c.note = String(t.note || '');
  c.conflict = null;
  c.error = '';
  // Re-based on what is live now, so the next Save is measured against the version on screen.
  c.baseStamp = calApptStampFor(c.apptId);
  setState({ apptSheet: c });
}

function renderHistory(now) {
  const d0 = dayStart(now);
  const yStart = d0 - 86400000;
  const dmap = {};
  state.entries.forEach(e => { if (e.medId === 'inpatient' || e.medId === 'inpatient_start' || e.medId === 'inpatient_end' || e.medId === 'cycle_start' || e.medId === 'cycle_end') return; const k = dayStart(e.ts); (dmap[k] = dmap[k] || []).push(e); });

  const historyDays = Object.keys(dmap).map(k => +k).sort((a, b) => b - a).map(k => {
    const missed = missedDosesFor(k, now);
    const items = [...dmap[k], ...missed].sort((a, b) => a.ts - b.ts);
    const tyDay = items.filter(e => e.medId === 'tylenol' && !e.missed).reduce((s, e) => s + (e.mg || 0), 0);
    const doses = items.filter(e => e.medId !== 'temp' && e.medId !== 'weight' && e.medId !== 'paracentesis' && e.medId !== 'cycle_start' && e.medId !== 'cycle_end' && !e.missed).length;
    const temps = items.filter(e => e.medId === 'temp').length;
    const weights = items.filter(e => e.medId === 'weight').length;
    const wkday = new Date(k).toLocaleDateString([], { weekday: 'long' });
    const md = (new Date(k).getMonth() + 1) + '/' + new Date(k).getDate();
    const label = k === d0 ? ('Today - ' + wkday + ' ' + md) : (wkday + ', ' + md);
    let summary = doses + ' dose' + (doses === 1 ? '' : 's');
    if (temps) summary += ' · ' + temps + ' temp' + (temps === 1 ? '' : 's');
    if (weights) summary += ' · ' + weights + ' wt';
    if (tyDay) summary += ' · ' + tyDay.toLocaleString() + ' mg APAP';
    const imoDay = items.filter(e => e.medId === 'imodium' && !e.missed).reduce((s, e) => s + (e.pills || 0), 0);
    if (imoDay) summary += ' · ' + imoDay + ' Imodium';
    if (missed.length) summary += ' · ' + missed.length + ' MISSED';
    return { key: k, label, summary, items };
  });

  if (historyDays.length === 0) {
    return [h('div', { style: { background: 'rgba(255,255,255,0.4)', backdropFilter: 'blur(12px)', WebkitBackdropFilter: 'blur(12px)', border: '1px dashed rgba(212,104,138,0.2)', borderRadius: '16px', padding: '30px', textAlign: 'center', color: '#7D6974', fontSize: '14px', lineHeight: '1.5' } }, 'No history yet.')];
  }

  return [h('div', { style: { display: 'flex', flexDirection: 'column', gap: '16px' } },
    ...historyDays.map(d => h('div', null,
      h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: '10px', marginBottom: '8px' } },
        h('div', { style: { fontSize: '13px', fontWeight: '800', letterSpacing: '0.03em', textTransform: 'uppercase', color: '#8A6479' } }, d.label),
        h('div', { className: 'mono', style: { fontSize: '12px', color: d.summary.includes('MISSED') ? '#C0453B' : '#7D6974', fontWeight: d.summary.includes('MISSED') ? '700' : '400' } }, d.summary)
      ),
      h('div', { style: { background: 'rgba(255,255,255,0.55)', backdropFilter: 'blur(16px)', WebkitBackdropFilter: 'blur(16px)', border: '1px solid rgba(212,104,138,0.12)', borderRadius: '16px', overflow: 'hidden', boxShadow: '0 4px 24px rgba(180,130,150,0.10), 0 1px 2px rgba(180,130,150,0.06), inset 0 1px 0 rgba(255,255,255,0.7)' } },
        ...(() => {
          const rows = [];
          d.items.forEach((e, i) => {
            const bk = timeBucket(e.ts);
            const newGroup = i === 0 || timeBucket(d.items[i - 1].ts) !== bk;
            if (newGroup) {
              rows.push(h('div', { style: { padding: '8px 14px 4px', fontSize: '10.5px', fontWeight: '800', letterSpacing: '0.06em', textTransform: 'uppercase', color: '#7D6974', background: 'rgba(212,104,138,0.06)', borderTop: i > 0 ? '1px solid rgba(212,104,138,0.08)' : 'none' } }, bk));
            }
            if (e.missed) { rows.push(missedRow(e, newGroup ? 0 : 1)); return; }
            rows.push(h('div', { style: { display: 'flex', alignItems: 'center', gap: '12px', padding: '12px 14px', borderTop: newGroup ? 'none' : '1px solid rgba(212,104,138,0.08)' } },
              h('div', { className: 'mono', style: { fontSize: '13px', color: '#8A6479', minWidth: '66px' } }, fmtTime(e.ts)),
              h('div', { style: { flex: '1' } },
                h('div', { style: { fontSize: '15px', fontWeight: '700', display: 'flex', alignItems: 'center', gap: '7px', flexWrap: 'wrap' } },
                  nameOf(e.medId),

// The Paracentesis report. Deliberately plain: how much in total, how many procedures, how long
// since the last one, then the list. Removal appends a tombstone rather than deleting, so it works
// at any age -- see para-patch.py's header for why a delete would silently fail after 48 hours.
function renderParacentesis(now) {
  const list = paracentesisResolved();
  if (!list.length) {
    return [h('div', { style: { background: 'rgba(255,255,255,0.4)', backdropFilter: 'blur(12px)', WebkitBackdropFilter: 'blur(12px)', border: '1px dashed rgba(212,104,138,0.2)', borderRadius: '16px', padding: '30px', textAlign: 'center', color: '#7D6974', fontSize: '14px', lineHeight: '1.5' } },
      'No paracentesis procedures logged yet.\nLog the litres drained from the card on Today.')];
  }
  const total = paraTotalLiters(list);
  const avg = total / list.length;
  const daysSince = Math.floor((dayStart(now) - dayStart(list[0].ts)) / 86400000);
  const sinceLabel = daysSince <= 0 ? 'Today' : daysSince === 1 ? '1 day' : (daysSince + ' days');
  const statCard = (label, value) => h('div', { style: { background: 'rgba(255,255,255,0.55)', backdropFilter: 'blur(16px)', WebkitBackdropFilter: 'blur(16px)', border: '1px solid rgba(212,104,138,0.12)', borderRadius: '14px', padding: '14px', textAlign: 'center', boxShadow: '0 4px 24px rgba(180,130,150,0.10), inset 0 1px 0 rgba(255,255,255,0.7)' } },
    h('div', { style: { fontSize: '11px', fontWeight: '700', letterSpacing: '0.05em', textTransform: 'uppercase', color: '#7D6974', marginBottom: '6px' } }, label),
    h('div', { className: 'mono', style: { fontSize: '18px', fontWeight: '700', color: '#3D2B3A' } }, value)
  );
  const stats = h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: '10px' } },
    statCard('Total drained', paraFmtLiters(total) + ' L'),
    statCard('Procedures', String(list.length)),
    statCard('Since last', sinceLabel)
  );
  const note = h('div', { style: { background: 'rgba(170,83,117,0.08)', border: '1px solid rgba(212,104,138,0.16)', borderRadius: '14px', padding: '12px 14px', fontSize: '12.5px', color: '#6E5261', lineHeight: '1.5' } },
    'Averaging ' + paraFmtLiters(avg) + ' L per procedure. These are recorded separately from weight — the Weight report still shows what the scale actually said, with a marker on each drain date.');
  const rows = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '10px' } },
    ...list.map(p => h('div', { style: { background: 'rgba(255,255,255,0.55)', backdropFilter: 'blur(16px)', WebkitBackdropFilter: 'blur(16px)', border: '1px solid rgba(212,104,138,0.12)', borderRadius: '14px', padding: '13px 14px', display: 'flex', alignItems: 'center', gap: '12px', boxShadow: '0 3px 14px rgba(180,130,150,0.09), inset 0 1px 0 rgba(255,255,255,0.7)' } },
      h('div', { style: { flex: '1', minWidth: '0' } },
        h('div', { style: { fontSize: '14.5px', fontWeight: '700', color: '#3D2B3A' } }, paraFmtLiters(p.liters) + ' L drained'),
        h('div', { style: { fontSize: '12px', color: '#7D6974', marginTop: '2px' } }, fmtDateLabel(p.ts))
      ),

        ? h('div', { style: { display: 'flex', gap: '6px', alignItems: 'center', flexShrink: '0' } },
            h('button', { onClick: () => removeParacentesis(p.paraId), style: { color: '#fff', background: '#C0453B', fontSize: '12.5px', fontWeight: '700', padding: '8px 12px', borderRadius: '9px' } }, 'Delete'),
            h('button', { onClick: () => setState({ confirmRemovePara: null }), style: { color: '#7D6974', fontSize: '12.5px', padding: '8px 6px', fontWeight: '600' } }, 'Keep')
          )
        : h('button', { onClick: () => setState({ confirmRemovePara: p.paraId }), style: { flexShrink: '0', color: '#8E3D61', fontSize: '12.5px', fontWeight: '700', padding: '8px 10px', borderRadius: '9px', background: 'rgba(170,83,117,0.10)' } }, 'Remove')
    ))

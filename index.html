function renderWeightTrend(now) {
  const weightEntries = state.entries.filter(e => e.medId === 'weight' && e.weight).sort((a, b) => a.ts - b.ts);
  const range = state.weightRange;
  const DAY = 86400000;

  // Range toggle
  const toggle = h('div', { style: { display: 'flex', gap: '5px', background: 'rgba(255,255,255,0.45)', borderRadius: '10px', padding: '3px', border: '1px solid rgba(212,104,138,0.12)', alignSelf: 'flex-start' } },
    h('button', { onClick: () => setState({ weightRange: 'weeks' }), style: { padding: '8px 18px', borderRadius: '8px', fontSize: '13px', fontWeight: '700', background: range === 'weeks' ? '#9B5B8A' : 'transparent', color: range === 'weeks' ? '#fff' : '#7D6974' } }, 'Weeks'),
    h('button', { onClick: () => setState({ weightRange: 'months' }), style: { padding: '8px 18px', borderRadius: '8px', fontSize: '13px', fontWeight: '700', background: range === 'months' ? '#9B5B8A' : 'transparent', color: range === 'months' ? '#fff' : '#7D6974' } }, 'Months')
  );

  if (weightEntries.length === 0) {
    return [
      toggle,
      h('div', { style: { background: 'rgba(255,255,255,0.03)', border: '1px dashed rgba(255,255,255,0.1)', borderRadius: '16px', padding: '40px', textAlign: 'center', color: '#7D6974', fontSize: '14px', lineHeight: '1.5' } },
        // A paracentesis can exist with no weight ever logged. Saying so here beats an empty page
        // that looks like the drains were lost.
        paracentesisResolved().length
          ? ('No weight readings logged yet.\nLog your first weight on the Today tab.\n\n' + paracentesisResolved().length + ' paracentesis ' + (paracentesisResolved().length === 1 ? 'procedure is' : 'procedures are') + ' recorded — see the Paracentesis report.')
          : 'No weight readings logged yet.\nLog your first weight on the Today tab.')
    ];
  }

  // Determine time range
  const spanDays = range === 'weeks' ? 28 : 90;
  const minTs = now - spanDays * DAY;
  const filtered = weightEntries.filter(e => e.ts >= minTs);
  const points = filtered.length > 0 ? filtered : weightEntries.slice(-2);

  if (points.length === 0) {
    return [toggle, h('div', { style: { color: '#7D6974', fontSize: '14px', textAlign: 'center', padding: '40px' } }, 'No data in this range.')];
  }

  // Calculate bounds
  const weights = points.map(p => p.weight);
  const allWeights = weightEntries.map(p => p.weight);
  const minW = Math.floor(Math.min(...weights) - 2);
  const maxW = Math.ceil(Math.max(...weights) + 2);
  const wRange = maxW - minW || 4;
  const tMin = points[0].ts;
  const tMax = Math.max(points[points.length - 1].ts, tMin + DAY);
  const tRange = tMax - tMin || DAY;

  // SVG dimensions
  const W = 680, H = 300;
  const pad = { top: 30, right: 20, bottom: 50, left: 55 };
  const cW = W - pad.left - pad.right;
  const cH = H - pad.top - pad.bottom;

  const x = (ts) => pad.left + ((ts - tMin) / tRange) * cW;
  const y = (w) => pad.top + cH - ((w - minW) / wRange) * cH;

  // Build SVG path
  let pathD = '';
  let areaD = '';
  const dots = [];
  points.forEach((p, i) => {
    const px = x(p.ts), py = y(p.weight);
    pathD += (i === 0 ? 'M' : 'L') + px.toFixed(1) + ',' + py.toFixed(1);
    if (i === 0) areaD = 'M' + px.toFixed(1) + ',' + (pad.top + cH);
    areaD += 'L' + px.toFixed(1) + ',' + py.toFixed(1);
    dots.push({ x: px, y: py, w: p.weight, ts: p.ts });
  });
  areaD += 'L' + x(points[points.length - 1].ts).toFixed(1) + ',' + (pad.top + cH) + 'Z';

  // Y-axis labels (weight)
  const ySteps = 5;
  const yLabels = [];
  for (let i = 0; i <= ySteps; i++) {
    const val = minW + (wRange / ySteps) * i;
    yLabels.push({ val: Math.round(val * 10) / 10, py: y(val) });
  }

  // X-axis labels (dates)
  const xLabels = [];
  const labelCount = range === 'weeks' ? 4 : 6;
  for (let i = 0; i <= labelCount; i++) {
    const ts = tMin + (tRange / labelCount) * i;
    const d = new Date(ts);
    const label = (d.getMonth() + 1) + '/' + d.getDate();
    xLabels.push({ label, px: x(ts) });
  }

  // Stats
  const latest = points[points.length - 1];
  const first = points[0];
  const change = latest.weight - first.weight;
  const changeLabel = (change >= 0 ? '+' : '') + change.toFixed(1) + ' lbs';
  const changeColor = Math.abs(change) < 0.5 ? '#8A6479' : change > 0 ? '#9A6419' : '#AA5375';
  const avg = (weights.reduce((s, w) => s + w, 0) / weights.length).toFixed(1);

  // Build SVG as string
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">';
  // Grid lines
  yLabels.forEach(yl => {
    svg += '<line x1="' + pad.left + '" y1="' + yl.py.toFixed(1) + '" x2="' + (W - pad.right) + '" y2="' + yl.py.toFixed(1) + '" stroke="rgba(212,104,138,0.10)" stroke-width="1"/>';
    svg += '<text x="' + (pad.left - 10) + '" y="' + (yl.py + 4).toFixed(1) + '" fill="#7D6974" font-size="11" font-family="IBM Plex Mono,monospace" text-anchor="end">' + yl.val + '</text>';
  });
  // X labels
  xLabels.forEach(xl => {
    svg += '<text x="' + xl.px.toFixed(1) + '" y="' + (H - 10) + '" fill="#7D6974" font-size="11" font-family="IBM Plex Mono,monospace" text-anchor="middle">' + xl.label + '</text>';
  });
  // Area gradient
  svg += '<defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(155,91,138,0.25)"/><stop offset="100%" stop-color="rgba(155,91,138,0)"/></linearGradient></defs>';
  svg += '<path d="' + areaD + '" fill="url(#wg)"/>';
  // Line
  svg += '<path d="' + pathD + '" fill="none" stroke="#9B5B8A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  // Dots
  dots.forEach((d, i) => {
    const isLast = i === dots.length - 1;
    svg += '<circle cx="' + d.x.toFixed(1) + '" cy="' + d.y.toFixed(1) + '" r="' + (isLast ? 5 : 3.5) + '" fill="' + (isLast ? '#9B5B8A' : '#7B3F6B') + '" stroke="' + (isLast ? '#AA5375' : '#9B5B8A') + '" stroke-width="' + (isLast ? 2 : 1.5) + '"/>';
    // Value label on last dot
    if (isLast) {
      svg += '<text x="' + d.x.toFixed(1) + '" y="' + (d.y - 12).toFixed(1) + '" fill="#7B3F6B" font-size="13" font-weight="700" font-family="IBM Plex Mono,monospace" text-anchor="middle">' + d.w + '</text>';
    }
  });
  // Paracentesis markers. Filtered against tMin/tMax -- the ACTUAL plotted span -- and never
  // against minTs: line ~5324 falls back to weightEntries.slice(-2) when nothing was weighed inside
  // the window, so the plotted span is not always the 28/90-day window. A marker outside the span
  // is dropped rather than clamped to the edge, because clamping would draw a drain on a date it
  // did not happen.
  const paraAll = paracentesisResolved();
  const paraInRange = paraAll.filter(p => p.ts >= tMin && p.ts <= tMax);
  paraInRange.forEach(p => {
    const px = x(p.ts);
    svg += '<line x1="' + px.toFixed(1) + '" y1="' + pad.top + '" x2="' + px.toFixed(1) + '" y2="' + (pad.top + cH) + '" stroke="rgba(62,116,158,0.45)" stroke-width="1.5" stroke-dasharray="4 3"/>';
    svg += '<circle cx="' + px.toFixed(1) + '" cy="' + (pad.top + cH) + '" r="4.5" fill="#3E749E" stroke="#FFFFFF" stroke-width="1.5"/>';
    svg += '<text x="' + px.toFixed(1) + '" y="' + (pad.top - 12) + '" fill="#3E749E" font-size="10.5" font-weight="700" font-family="IBM Plex Mono,monospace" text-anchor="middle">' + paraFmtLiters(p.liters) + 'L</text>';
  });
  svg += '</svg>';

  // Chart card
  const chart = h('section', { style: { background: 'rgba(255,255,255,0.55)', backdropFilter: 'blur(16px)', WebkitBackdropFilter: 'blur(16px)', border: '1px solid rgba(212,104,138,0.12)', borderRadius: '18px', padding: '20px 16px 12px', boxShadow: '0 4px 24px rgba(180,130,150,0.10), 0 1px 2px rgba(180,130,150,0.06), inset 0 1px 0 rgba(255,255,255,0.7)' } },
    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '16px' } },
      h('div', null,
        h('div', { style: { fontSize: '11.5px', fontWeight: '700', letterSpacing: '0.05em', textTransform: 'uppercase', color: '#8A6479' } }, 'Weight Trend'),
        h('div', { style: { fontSize: '12.5px', color: '#7D6974', marginTop: '3px' } }, range === 'weeks' ? 'Last 4 weeks' : 'Last 3 months')
      ),
      h('div', { className: 'mono', style: { fontSize: '24px', fontWeight: '700', color: '#7B3F6B', letterSpacing: '-0.02em' } }, latest.weight + ' lbs')
    ),
    h('div', { innerHTML: svg })
  );

  // Stats row
  const stats = h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: '10px' } },
    h('div', { style: { background: 'rgba(255,255,255,0.55)', backdropFilter: 'blur(16px)', WebkitBackdropFilter: 'blur(16px)', border: '1px solid rgba(212,104,138,0.12)', borderRadius: '14px', padding: '14px', textAlign: 'center', boxShadow: '0 4px 24px rgba(180,130,150,0.10), inset 0 1px 0 rgba(255,255,255,0.7)' } },
      h('div', { style: { fontSize: '11px', fontWeight: '700', letterSpacing: '0.05em', textTransform: 'uppercase', color: '#7D6974', marginBottom: '6px' } }, 'Current'),
      h('div', { className: 'mono', style: { fontSize: '18px', fontWeight: '700', color: '#3D2B3A' } }, latest.weight + '')
    ),
    h('div', { style: { background: 'rgba(255,255,255,0.55)', backdropFilter: 'blur(16px)', WebkitBackdropFilter: 'blur(16px)', border: '1px solid rgba(212,104,138,0.12)', borderRadius: '14px', padding: '14px', textAlign: 'center', boxShadow: '0 4px 24px rgba(180,130,150,0.10), inset 0 1px 0 rgba(255,255,255,0.7)' } },
      h('div', { style: { fontSize: '11px', fontWeight: '700', letterSpacing: '0.05em', textTransform: 'uppercase', color: '#7D6974', marginBottom: '6px' } }, 'Average'),
      h('div', { className: 'mono', style: { fontSize: '18px', fontWeight: '700', color: '#3D2B3A' } }, avg)
    ),
    h('div', { style: { background: 'rgba(255,255,255,0.55)', backdropFilter: 'blur(16px)', WebkitBackdropFilter: 'blur(16px)', border: '1px solid rgba(212,104,138,0.12)', borderRadius: '14px', padding: '14px', textAlign: 'center', boxShadow: '0 4px 24px rgba(180,130,150,0.10), inset 0 1px 0 rgba(255,255,255,0.7)' } },
      h('div', { style: { fontSize: '11px', fontWeight: '700', letterSpacing: '0.05em', textTransform: 'uppercase', color: '#7D6974', marginBottom: '6px' } }, 'Change'),
      h('div', { className: 'mono', style: { fontSize: '18px', fontWeight: '700', color: changeColor } }, changeLabel)
    )
  );

  // Readings list
  const readingsItems = points.slice().reverse().map((p, i) => {
    const d = new Date(p.ts);
    const day = d.toLocaleDateString([], { weekday: 'short', month: 'numeric', day: 'numeric' });
    const time = fmtTime(p.ts);
    return h('div', { style: { display: 'flex', alignItems: 'center', gap: '12px', padding: '11px 14px', borderTop: i > 0 ? '1px solid rgba(212,104,138,0.08)' : 'none' } },
      h('div', { style: { flex: '1' } },
        h('div', { style: { fontSize: '14px', fontWeight: '700' } }, day),
        h('div', { style: { fontSize: '12px', color: '#7D6974' } }, time)
      ),
      h('div', { className: 'mono', style: { fontSize: '16px', fontWeight: '600', color: '#7B3F6B' } }, p.weight + ' lbs')
    );
  });

  const readings = h('section', null,
    h('div', { style: { fontSize: '13px', fontWeight: '800', letterSpacing: '0.04em', textTransform: 'uppercase', color: '#8A6479', marginBottom: '10px' } }, 'All Readings'),
    h('div', { style: { background: 'rgba(255,255,255,0.55)', backdropFilter: 'blur(16px)', WebkitBackdropFilter: 'blur(16px)', border: '1px solid rgba(212,104,138,0.12)', borderRadius: '16px', overflow: 'hidden', boxShadow: '0 4px 24px rgba(180,130,150,0.10), inset 0 1px 0 rgba(255,255,255,0.7)' } },
      ...readingsItems
    )
  );

  // The drained-total line. This is Aaron's "notes for weight that can add the para together to
  // see how much was drained" -- reported against the SAME window the chart is showing, so the
  // number always matches the picture above it. The plotted weights are not adjusted by any of it.
  const paraLine = paraInRange.length
    ? h('div', { style: { background: 'rgba(62,116,158,0.09)', border: '1px solid rgba(62,116,158,0.22)', borderRadius: '14px', padding: '12px 14px', display: 'flex', alignItems: 'center', gap: '10px' } },
        h('span', { style: { flexShrink: '0', width: '10px', height: '10px', borderRadius: '50%', background: '#3E749E' } }),
        h('div', { style: { fontSize: '12.5px', color: '#4A5C6B', lineHeight: '1.45' } },
          h('span', { style: { fontWeight: '800' } }, paraInRange.length + ' paracentesis ' + (paraInRange.length === 1 ? 'procedure' : 'procedures') + ' in this range · ' + paraFmtLiters(paraTotalLiters(paraInRange)) + ' L drained'),
          h('span', { style: { display: 'block', marginTop: '2px' } }, 'Marked on the chart. Weight readings are shown exactly as recorded and are not adjusted for drainage.')
        )
      )
    : (paraAll.length
        ? h('div', { style: { background: 'rgba(255,255,255,0.45)', border: '1px solid rgba(212,104,138,0.12)', borderRadius: '14px', padding: '11px 14px', fontSize: '12.5px', color: '#7D6974', lineHeight: '1.45' } },
            'No paracentesis in this range. ' + paraAll.length + ' recorded overall · ' + paraFmtLiters(paraTotalLiters(paraAll)) + ' L total.')
        : null);
  return paraLine ? [toggle, chart, stats, paraLine, readings] : [toggle, chart, stats, readings];
}


// --------- Notification System ---------
let notifSentToday = {};  // key: 'scheduled-8pm' or 'avail-tylenol-{ts}', value: true

function resetNotifTracking() {
  const today = dayStart(Date.now());
  if (notifSentToday._day !== today) {
    notifSentToday = { _day: today };
  }
}

function requestNotifPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function sendNotif(title, body, tag) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    new Notification(title, { body, icon: 'icon-192.png', tag, requireInteraction: false });
  } catch(e) {
    // Fallback for mobile: use service worker registration
    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
      navigator.serviceWorker.ready.then(reg => {
        reg.showNotification(title, { body, icon: 'icon-192.png', tag, requireInteraction: false });
      }).catch(() => {});
    }
  }
}

function checkNotifications() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  if (!state.loaded || state.entries.length === 0) return;

  resetNotifTracking();
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const nowTs = now.getTime();

  // Quiet hours: no notifications between 10 PM (22) and 8 AM (8)
  if (h >= 22 || h < 8) return;

  // --- SCHEDULED REMINDERS ---

  // 8:00 PM reminder (20:00) - evening meds
  // Fire between 8:00 PM and 8:05 PM
  if (h === 20 && m < 5 && !notifSentToday['sched-8pm']) {
    const eveningMeds = ['protonix', 'iron', 'compazine'];
    const due = [];
    const d0 = dayStart(nowTs);
    eveningMeds.forEach(medId => {
      const med = state.meds.find(x => x.id === medId);
      if (!med) return;
      // Check if already taken in the evening window today
      if (med.type === 'win') {
        const eveningWin = med.windows.find(w => w.start >= 17);
        if (eveningWin) {
          const ws = d0 + eveningWin.start * 3600000;
          const we = d0 + eveningWin.end * 3600000;
          const taken = state.entries.some(e => e.medId === medId && e.ts >= ws && e.ts < we);
          if (!taken) due.push(med.name);
        } else {
          // Anytime window (iron) - check if taken today at all
          const taken = state.entries.some(e => e.medId === medId && e.ts >= d0);
          if (!taken) due.push(med.name);
        }
      } else if (med.type === 'gap') {
        // Compazine is gap-based but reminder at 8pm
        const st = status(med);
        if (!st.locked) due.push(med.name);
      }
    });
    if (due.length > 0) {
      sendNotif('Evening Meds Due', due.join(', ') + ' — time for evening doses', 'evening-8pm');
    }
    notifSentToday['sched-8pm'] = true;
  }

  // 8:30 AM reminder (8:30) - morning meds
  // Fire between 8:30 AM and 8:35 AM
  if (h === 8 && m >= 30 && m < 35 && !notifSentToday['sched-830am']) {
    const morningMeds = [];
    const d0 = dayStart(nowTs);
    // Protonix morning window
    const protonix = state.meds.find(x => x.id === 'protonix');
    if (protonix) {
      const mornWin = protonix.windows.find(w => w.start < 12);
      if (mornWin) {
        const ws = d0 + mornWin.start * 3600000;
        const we = d0 + mornWin.end * 3600000;
        const taken = state.entries.some(e => e.medId === 'protonix' && e.ts >= ws && e.ts < we);
        if (!taken) morningMeds.push('Protonix');
      }
    }
    if (morningMeds.length > 0) {
      sendNotif('Morning Meds Due', morningMeds.join(', ') + ' — time for morning doses', 'morning-830am');
    }
    notifSentToday['sched-830am'] = true;
  }

  // 10:00 AM reminder (9:55-10:05) - Buspirone/Paroxetine (default window; if Protonix's actual
  // morning dose logs later, morningWindowsFor() shifts these to 2h after that instead, and
  // status().locked reflects that shift automatically — no separate dynamic check needed here
  // since this fixed slot already lines up with the 10 AM default).
  if ((h === 9 && m >= 55) || (h === 10 && m <= 5)) {
    if (!notifSentToday['sched-10am']) {
      const due = [];
      ['buspirone', 'paroxetine'].forEach(medId => {
        const med = state.meds.find(x => x.id === medId);
        if (!med) return;
        const st = status(med);
        if (!st.locked) due.push(med.name);
      });
      if (due.length > 0) {
        sendNotif('Morning Meds Due', due.join(', ') + ' — time for morning doses', 'morning-10am');
      }
      notifSentToday['sched-10am'] = true;
    }
  }

  // --- GAP-BASED REMINDERS (fire when med becomes available) ---
  const gapMeds = []; // Zofran is as-needed now — no gap-based availability reminder
  gapMeds.forEach(medId => {
    const med = state.meds.find(x => x.id === medId);
    if (!med) return;
    const st = status(med);

    // Only notify when med just became available (was locked, now open)
    if (st.locked) return;

    // Check daily ceiling - don't notify if ceiling hit
    if (st.ceilingHit) return;

    // For Zofran: the 8:30 AM reminder already covers morning.
    // Only send gap-based for later-in-day availability.
    const last = latest(medId);
    if (!last) return; // No previous dose, don't spam

    // Create a unique key based on the dose timestamp so we only notify once per availability window
    const notifKey = 'avail-' + medId + '-' + last.ts;
    if (notifSentToday[notifKey]) return;

    // Only notify if the gap JUST expired (within the last 2 minutes)
    // This prevents firing on every render cycle
    if (med.type === 'gap' && med.gapH > 0) {
      const gapEnd = last.ts + med.gapH * 3600000;
      const sinceFree = nowTs - gapEnd;
      if (sinceFree >= 0 && sinceFree < 120000) {
        sendNotif(med.name + ' Available', med.name + ' gap timer is up — ready to dose', 'avail-' + medId);
        notifSentToday[notifKey] = true;
      }
    }
  });
}

// Request push notification permission and subscribe to FCM
subscribePush();


// ---------------- Guided tour (v44) ----------------
// TOUR-PATCH-MARK
//
// Aaron's requirement in full: skippable, re-runnable from the menu, and it must NEVER block the
// app. ChemoWell's tour gates its app until setup completes; this one deliberately does the
// opposite, in four ways:
//
//  1. IT NEVER STARTS ON ITS OWN. There is no first-run flag, no prefs read, no Firestore read,
//     no localStorage key -- nothing exists that could decide to show it. The only way in is the
//     "Take a quick tour" row at the bottom of the menu. A tour with no auto-start has no path by
//     which it can stand between a patient and logging a dose, which is the failure we are
//     refusing to ship. It also means the tour is unaffected by prefs failing to load or by
//     Firestore being offline: it reads neither.
//  2. FOUR INDEPENDENT EXITS ON EVERY STEP -- Skip, the X, the Escape key, and a tap on the dimmed
//     backdrop. If any one of them regressed, three still work.
//  3. IT PUTS THE SCREEN BACK. The view and report the tour was started from are recorded at
//     start and restored on exit, so leaving at the Reports step does not strand anyone in
//     Reports.
//  4. IT LIVES OUTSIDE #root. render() does `root.innerHTML = ''`, so a tour built inside root
//     would be destroyed by any repaint. It is appended to <body> instead and only ever
//     repositioned, never rebuilt, by a repaint.
//
// The backdrop DOES swallow taps aimed at the app underneath, and that is the one place this is
// deliberately modal. Letting taps through would mean someone reading the "Logging a dose" step
// could log a real dose by touching the highlighted card. Wrong dose data in a chemotherapy log
// is a worse outcome than a modal you leave with one tap. "Never blocks the app" is honoured by
// the tour never appearing unbidden and never having fewer than four ways out -- not by making
// the highlighted control live.

let tourEl = null;

function tourStepAt(i) {
  const n = TOUR_STEPS.length;
  const k = Math.max(0, Math.min(n - 1, Number(i) || 0));
  return TOUR_STEPS[k];
}

// Returns the element a step points at, or null. Null is a supported outcome, not a failure: the
// missed-dose step has nothing to point at on a day with no misses, and a brand-new phone with
// Firestore offline has no medication cards at all. positionTour() centres the card and hides the
// spotlight in that case, and the step still reads correctly.
function tourAnchorEl(step) {
  if (!step || !step.sel) return null;
  const list = Array.isArray(step.sel) ? step.sel : [step.sel];
  for (const s of list) {
    let el = null;
    try { el = document.querySelector(s); } catch (err) { el = null; }
    if (el && el.getClientRects && el.getClientRects().length) return el;
  }
  return null;
}

function tourMount() {
  if (tourEl) return;
  tourEl = document.createElement('div');
  tourEl.setAttribute('data-tour-root', 'true');
  // 120 clears every other layer in the app, including the z-index:100 "Connecting..." overlay,
  // so a tour that is somehow open while the connection drops is still readable and still
  // dismissible rather than being buried under a screen with no controls on it.
  tourEl.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:120;';
  document.body.appendChild(tourEl);
}

function tourUnmount() {
  if (tourEl && tourEl.parentNode) tourEl.parentNode.removeChild(tourEl);
  tourEl = null;
  tourScrimEl = null;
  tourRingEl = null;
  tourCardEl = null;
}

function tourReflow() { positionTour(false); }

// Geometry only -- never rebuilds the card, so it can be called from a scroll handler, from the
// one-second tick and from the tail of render() without ever moving focus.
function positionTour(animate) {
  if (!state.tour || !tourEl || !tourCardEl || !tourRingEl || !tourScrimEl) return;
  const step = tourStepAt(state.tour.i);
  const el = tourAnchorEl(step);
  const vw = window.innerWidth || document.documentElement.clientWidth || 375;
  const vh = window.innerHeight || document.documentElement.clientHeight || 812;
  const card = tourCardEl;
  card.style.transition = animate ? 'left 160ms ease, top 160ms ease' : 'none';
  tourRingEl.style.transition = animate ? 'left 160ms ease, top 160ms ease, width 160ms ease, height 160ms ease' : 'none';
  const cardW = card.offsetWidth || Math.min(340, vw - 24);
  const cardH = card.offsetHeight || 190;

  if (!el) {
    tourRingEl.style.opacity = '0';
    tourScrimEl.style.background = 'rgba(52,26,44,0.5)';
    card.style.left = Math.round(Math.max(12, (vw - cardW) / 2)) + 'px';
    card.style.top = Math.round(Math.max(12, (vh - cardH) / 2)) + 'px';
    return;
  }

  const r = el.getBoundingClientRect();
  const pad = 6;
  const rx = Math.max(0, r.left - pad);
  const ry = Math.max(0, r.top - pad);
  const rw = Math.max(0, Math.min(vw, r.right + pad) - rx);
  const rh = Math.max(0, Math.min(vh, r.bottom + pad) - ry);
  tourRingEl.style.opacity = '1';
  tourRingEl.style.left = Math.round(rx) + 'px';
  tourRingEl.style.top = Math.round(ry) + 'px';
  tourRingEl.style.width = Math.round(rw) + 'px';
  tourRingEl.style.height = Math.round(rh) + 'px';
  // The dimming is carried by the ring's own outer shadow, which leaves the highlighted control at
  // full brightness. The scrim underneath goes clear so the two do not stack into a double dim.
  tourScrimEl.style.background = 'transparent';

  const gap = 12;
  const margin = 12;
  const below = r.bottom + gap;
  const above = r.top - gap - cardH;
  let top;
  if (below + cardH <= vh - margin) top = below;
  else if (above >= margin) top = above;
  // Neither side fits, which means the target is taller than the room around it. Pin the card to
  // the bottom rather than centring it: centred, the card lands on the middle of the highlighted
  // block and covers the very heading the step is naming.
  else top = Math.max(margin, vh - cardH - margin);
  let left = r.left + (r.width / 2) - (cardW / 2);
  left = Math.max(margin, Math.min(left, vw - cardW - margin));
  card.style.left = Math.round(left) + 'px';
  card.style.top = Math.round(top) + 'px';
}

// Puts the app behind the tour onto the screen this step is about. Deliberately does NOT call
// calCloseDrawer(): that path exists to hand focus back to the menu button, and its handoff lands
// after the tour has taken focus and pulls it straight back out. The drawer flags are cleared
// directly here instead, and the tour claims focus on a double rAF so it wins that race outright.
function tourApplyView(step) {
  calDrawerNeedsFocus = false;
  calSheetNeedsFocus = false;
  state.drawerOpen = !!(step && step.drawer);
  if (step && step.view) {
    state.view = step.view;
    state.reportsView = null;
  }
  // Deliberately does not clear state.medEditor. A half-filled medication form is typed data, and
  // discarding it because someone opened the tour would be the tour destroying work -- the exact
  // thing it is not allowed to do. It stays open behind the tour and is still there afterwards.
  render();
}

function tourRenderStep() {
  if (!state.tour || !tourEl) return;
  const i = state.tour.i;
  const step = tourStepAt(i);
  const n = TOUR_STEPS.length;
  const isLast = i === n - 1;

  const scrim = h('div', {
    'data-tour-scrim': 'true',
    onClick: (e) => { if (e.target === e.currentTarget) tourEnd(); },
    style: { position: 'absolute', left: '0', top: '0', right: '0', bottom: '0', background: 'rgba(52,26,44,0.5)' }
  });

  const ring = h('div', {
    'data-tour-ring': 'true', 'aria-hidden': 'true',
    style: { position: 'absolute', left: '0px', top: '0px', width: '0px', height: '0px', borderRadius: '16px', pointerEvents: 'none', opacity: '0', boxShadow: '0 0 0 3px rgba(255,255,255,0.9), 0 0 0 5px rgba(212,104,138,0.85), 0 0 0 9999px rgba(52,26,44,0.5)' }
  });

  const btnBase = { minHeight: '44px', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', borderRadius: '13px', fontSize: '14px', fontWeight: '800', cursor: 'pointer' };

  const card = h('div', {
    'data-tour-card': 'true', 'data-tour-step': String(i), 'data-tour-key': step.key,
    role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'tour-title', 'aria-describedby': 'tour-body', tabindex: '-1',
    style: { position: 'absolute', left: '0px', top: '0px', width: 'min(340px, calc(100vw - 24px))', boxSizing: 'border-box', background: 'rgba(255,247,250,0.985)', backdropFilter: 'blur(24px)', WebkitBackdropFilter: 'blur(24px)', border: '1px solid rgba(212,104,138,0.24)', borderRadius: '20px', boxShadow: '0 18px 48px rgba(90,40,70,0.32)', padding: '14px 15px 13px', outline: 'none' }
  },
    h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px' } },
      h('span', { 'data-tour-count': 'true', className: 'mono', style: { flex: '1', minWidth: '0', fontSize: '11px', fontWeight: '800', letterSpacing: '0.06em', textTransform: 'uppercase', color: '#8E3D61' } }, 'Step ' + (i + 1) + ' of ' + n),
      h('button', { 'data-tour-close': 'true', type: 'button', onClick: () => tourEnd(), 'aria-label': 'Close the tour', style: { width: '44px', height: '44px', flexShrink: '0', margin: '-6px -7px -6px 0', borderRadius: '13px', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(170,83,117,0.10)', color: '#AA5375', cursor: 'pointer' } }, appIcon('calClose', 18))
    ),
    h('h2', { id: 'tour-title', 'data-tour-title': 'true', style: { margin: '7px 0 0', fontSize: '17px', fontWeight: '800', letterSpacing: '-0.02em', color: '#342530', lineHeight: '1.2' } }, step.title),
    h('p', { id: 'tour-body', 'data-tour-body': 'true', style: { margin: '6px 0 0', fontSize: '14px', lineHeight: '1.45', color: '#5F4A56' } }, step.body),
    h('div', { 'data-tour-dots': 'true', role: 'group', 'aria-label': 'Tour progress', style: { display: 'flex', gap: '5px', marginTop: '12px' } },
      // aria-current is SPREAD IN, never passed as a nullish value. h() falls through to a bare
      // el.setAttribute() for anything it does not special-case, so `aria-current: null` renders
      // the literal aria-current="null" and every dot claims to be the current step.
      ...TOUR_STEPS.map((s, k) => h('span', Object.assign({
        'data-tour-dot': s.key,
        style: { width: k === i ? '18px' : '6px', height: '6px', borderRadius: '99px', background: k === i ? '#AA5375' : 'rgba(170,83,117,0.28)', transition: 'width 160ms ease' }
      }, k === i ? { 'aria-current': 'step' } : {})))
    ),
    h('div', { style: { display: 'flex', alignItems: 'center', gap: '8px', marginTop: '12px' } },
      h('button', { 'data-tour-skip': 'true', type: 'button', onClick: () => tourEnd(), style: { ...btnBase, padding: '0 11px', background: 'transparent', color: '#745D69', fontSize: '13.5px' } }, 'Skip'),
      h('span', { style: { flex: '1' } }),
      // Back is OMITTED on the first step rather than rendered disabled. `disabled: false` and
      // `disabled: null` both disable a control through h(), and a permanently dead button on the
      // opening step is exactly the class of defect this app has shipped four times.
      i > 0 ? h('button', { 'data-tour-back': 'true', type: 'button', onClick: () => tourGo(i - 1), style: { ...btnBase, padding: '0 14px', background: 'rgba(255,255,255,0.72)', border: '1px solid rgba(212,104,138,0.32)', color: '#8E3D61' } }, 'Back') : null,
      h('button', { 'data-tour-next': 'true', type: 'button', onClick: () => tourNext(), style: { ...btnBase, padding: '0 16px', background: '#AA5375', color: '#fff', boxShadow: 'inset 0 -2px 0 rgba(121,57,84,0.35)' } }, isLast ? 'Done' : 'Next')
    )
  );

  tourEl.innerHTML = '';
  scrim.appendChild(ring);
  scrim.appendChild(card);
  tourEl.appendChild(scrim);
  tourScrimEl = scrim;
  tourRingEl = ring;
  tourCardEl = card;

  const el = tourAnchorEl(step);
  if (el && typeof el.scrollIntoView === 'function') {
    try {
      // A block taller than the screen must NOT be centred: centring puts its heading -- the thing
      // the step is actually naming -- above the top of the viewport, and the spotlight then
      // clamps to the screen edge instead of tracing the target. Align its top instead, then back
      // off by the height of the sticky header so the header is not sitting on top of it.
      const vhNow = window.innerHeight || 812;
      const tall = el.getBoundingClientRect().height > vhNow * 0.6;
      el.scrollIntoView({ block: tall ? 'start' : 'center', inline: 'nearest', behavior: 'auto' });
      if (tall) window.scrollBy(0, -96);
    } catch (err) {}
  }
  positionTour(false);
  // Two frames, not one. calFocusOnce() hands focus to a newly opened dialog on a single rAF;
  // taking focus on the second frame means the tour wins that race every time instead of most
  // of the time. Focus lands on the card, never on a text field, so no keyboard is thrown up.
  requestAnimationFrame(() => {
    positionTour(false);
    requestAnimationFrame(() => {
      positionTour(false);
      if (tourCardEl) { try { tourCardEl.focus(); } catch (err) {} }
    });
  });
}

function tourKeyHandler(e) {
  if (!state.tour) return;
  if (e.key === 'Escape' || e.key === 'Esc') {
    e.preventDefault();
    e.stopPropagation();
    tourEnd();
    return;
  }
  if (e.key !== 'Tab' || !tourCardEl) return;
  const items = Array.prototype.slice.call(tourCardEl.querySelectorAll('button'));
  if (!items.length) return;
  const first = items[0];
  const last = items[items.length - 1];
  const active = document.activeElement;
  if (!tourCardEl.contains(active)) { e.preventDefault(); (e.shiftKey ? last : first).focus(); return; }
  if (e.shiftKey && active === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && active === last) { e.preventDefault(); first.focus(); }
}

function tourGo(next) {
  if (!state.tour) return;
  state.tour.i = Math.max(0, Math.min(TOUR_STEPS.length - 1, Number(next) || 0));
  tourApplyView(tourStepAt(state.tour.i));
  tourRenderStep();
}

function tourNext() {
  if (!state.tour) return;
  if (state.tour.i >= TOUR_STEPS.length - 1) { tourEnd(); return; }
  tourGo(state.tour.i + 1);
}

function tourStart() {
  if (state.tour) return;
  // Anything half-typed is closed before the tour takes over, because the tour changes screens
  // underneath and a sheet left open behind it would be unreachable. Reached only from the menu,
  // and the menu cannot be open at the same time as the appointment sheet or the time modal.
  state.tour = { i: 0, retView: state.view, retReports: state.reportsView || null };
  tourMount();
  document.addEventListener('keydown', tourKeyHandler, true);
  window.addEventListener('resize', tourReflow);
  window.addEventListener('scroll', tourReflow, true);
  tourGo(0);
}

// Safe to call twice, from any step, with the DOM in any state. Every teardown line is guarded or
// idempotent, because "I tapped Skip twice" must not be a way to end up with a dead overlay.
function tourEnd() {
  const t = state.tour;
  state.tour = null;
  document.removeEventListener('keydown', tourKeyHandler, true);
  window.removeEventListener('resize', tourReflow);
  window.removeEventListener('scroll', tourReflow, true);
  tourUnmount();
  if (t) {
    state.view = t.retView || 'home';
    state.reportsView = t.retReports || null;
  }
  state.drawerOpen = false;
  calDrawerNeedsFocus = false;
  render();
  window.scrollTo(0, 0);
  requestAnimationFrame(() => {
    const b = document.querySelector('[data-tour-menu]');
    if (b) { try { b.focus(); } catch (err) {} }
  });
}

// Init
unsubPrefs = subscribePrefs((prefs) => {
  // ONE patch, ONE repaint.  medsyncOnPrefs mutates the patch object rather than calling setState
  // itself, so a snapshot carrying both a cleared banner and a new shared medication list does not
  // render twice.  It never throws: every read inside it is defensive and every write is
  // fire-and-forget, because this callback also runs on the phone that is mid-dose.
  const patch = { missedClearedAt: prefs && prefs.missedClearedAt ? prefs.missedClearedAt : 0 };
  try { medsyncOnPrefs(prefs, patch); } catch (err) { console.warn('[medsync] prefs handler:', err); }
  // This handler had NO guard at all: every prefs snapshot repainted the whole tree.  v46 put
  // the shared medication list and per-device snapshots into this same document, so ordinary
  // use now generates prefs traffic that lands while somebody is typing.
  if (uiIsBusy()) {
    // Newest-wins merge rather than replace: two snapshots arriving back to back must not let
    // the second one drop a field the first one carried.
    pendingPrefs = Object.assign(pendingPrefs || {}, patch);
    return;
  }
  setState(patch);
});
unsub = subscribeEntries((entries) => {
  // state.appointments was already refreshed inside subscribeEntries above, so the calendar is
  // never stale; what is deferred here is only the state.entries swap and the repaint that comes
  // with it, which would otherwise wipe a half-typed appointment when a sync lands.
  if (uiIsBusy()) {
    // Defer the swap AND the repaint that comes with it.  Previously this checked only
    // timeModal/apptSheet, so a sync landing while someone typed a weight, a temperature or a
    // medication name rebuilt the tree under them and the entry was lost.  The payload is
    // held, not discarded -- syncFlushPending() below lands it as soon as the UI is free.
    pendingEntries = entries;
    // First load still populates immediately: an empty app showing nothing because the user
    // happened to be focused somewhere would be a worse bug than the one being fixed.
    if (!state.loaded) { state.loaded = true; state.entries = entries; render(); }
    return;
  }
  setState({ entries, loaded: true });
});

// Lands anything the snapshot handlers held back.  Driven by the 1s interval below, which runs
// whether or not a render happens, so a held update can never be stranded -- the worst case is
// that it appears up to one second late, which is invisible next to losing a typed entry.
function syncFlushPending() {
  if (uiIsBusy()) return;
  if (!pendingEntries && !pendingPrefs) return;
  const patch = {};
  if (pendingPrefs) { Object.assign(patch, pendingPrefs); pendingPrefs = null; }
  if (pendingEntries) { patch.entries = pendingEntries; patch.loaded = true; pendingEntries = null; }
  setState(patch);   // one repaint for both, never two
}

setInterval(() => {
  state.now = simNow();
  // Flush FIRST: if a sync has been waiting for the user to stop typing, showing it is more
  // urgent than advancing the clock, and doing it here means the tick's own guard below sees
  // the already-updated state instead of repainting twice in the same second.
  syncFlushPending();
  const activeTag = document.activeElement && document.activeElement.tagName;
  // A repaint rebuilds the entire tree.  If one lands between the touchstart and the touchend of a
  // tap, the element under the finger is replaced and the click never fires — a chip that silently
  // does nothing roughly one tap in twelve.  The open reason sheet is folded into this existing
  // guard rather than into the `if` below it, so this patch and the calendar patch (which rewrites
  // that `if`) can be applied in either order.
  const isEditing = activeTag === 'INPUT' || activeTag === 'SELECT' || activeTag === 'TEXTAREA' || !!state.missReasonSheet;
  // A repaint rebuilds the whole tree, so a once-a-second tick underneath an open dialog
  // destroys and recreates the control being touched. The drawer and the appointment sheet
  // get the same protection the time modal already had.
  // COMPOSED, NOT OVERWRITTEN.  Every term below belongs to a different patch: timeModal is
  // original, apptSheet and drawerOpen are the calendar patch's, missReasonSheet rides inside
  // isEditing from the reason patch, and !state.tour is this one.  Dropping any single term ships
  // a once-a-second repaint that destroys the control somebody is currently touching -- the
  // appointment sheet losing focus mid-sentence is a defect this project has already shipped.
  if (!state.timeModal && !state.apptSheet && !state.drawerOpen && !state.tour && !isEditing) render();
  // Skipping render() during a tour is what stops the spotlight jumping, but the page underneath
  // can still reflow with no repaint at all -- a sync landing, an image settling, the keyboard
  // closing.  Re-glue the highlight to its target instead of leaving it on stale coordinates.
  else if (state.tour) positionTour(false);
  checkNotifications();
}, 1000);
render();

// Service worker registration
if ('serviceWorker' in navigator) {
  // updateViaCache:'none' is the whole point of this line. The default ('imports') leaves sw.js
  // itself subject to the HTTP cache, and GitHub Pages serves it with a max-age -- so reg.update()
  // could compare the new worker against a CACHED COPY OF ITSELF, find no difference, and do
  // nothing. The update check now always goes to the network.
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    // Proactively check for a newer sw.js on every load instead of relying solely on the
    // browser's own background update check, which can be slow/throttled and left the app
    // running stale cached JS (with already-pushed bug fixes not applying) for multiple page
    // loads — found and fixed during the 30-use-case QA pass on the testing app (see README.md).
    reg.update().catch(() => {});
    // An installed PWA is rarely "loaded" -- it is resumed. iOS in particular can keep a home-screen
    // app suspended for days, so a check that only runs on first load may not run for days either.
    // Re-checking when the app comes back to the foreground is the moment that actually matters.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') reg.update().catch(() => {});
    });
  }).catch(() => {});

  // Once a new service worker activates and takes control, reload once so this tab picks up
  // the new app shell immediately rather than continuing to run the JS it started with.
  let swRefreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (swRefreshing) return;
    swRefreshing = true;
    window.location.reload();
  });
}
</script>
</body>
</html>

function subscribeEntries(callback) {
  const q = query(col, orderBy("ts", "asc"));
  return onSnapshot(q, (snap) => {
    const mrRaw = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    // Missed-dose reasons are notes ABOUT a non-event, not doses.  They are split out of
    // state.entries here — before anything downstream can see them — exactly the way chemo_date is
    // split out on the next line.  That is what keeps them out of every dose count, out of the
    // daily log, out of the printable report's entry tables and out of the CSV BY CONSTRUCTION,
    // rather than by a dozen call sites each remembering to filter.  allExportEntries() is
    // entries + chemoDates and this patch deliberately does not change it.
    state.missReasons = mrResolveReasons(mrRaw);
    const all = mrRaw.filter((e) => !e || e.medId !== MR_MED_ID);
    state.chemoDates = all.filter(e => e.medId === 'chemo_date');
    // Appointments are scheduling records, not doses. They are split out of state.entries exactly
    // the way chemo_date is, one line above, so that every dose calculation, every report, the CSV
    // and the printable record all keep ignoring them BY CONSTRUCTION rather than by each one
    // remembering to filter. allExportEntries() is entries+chemoDates and is deliberately left
    // untouched: an appointment is not a dose and has no place in a clinical hand-off.
    state.appointments = calResolveAppointments(all.filter(e => e.medId === CAL_APPT_MED_ID));
    callback(all.filter(e => e.medId !== 'chemo_date' && e.medId !== CAL_APPT_MED_ID));
  });
}
// A rejected write used to be a SILENT failure: the rejection went unhandled, the caller's
// success toast was skipped by the throw, the modal had already closed -- and the patient was
// told nothing at all. She would believe a dose was recorded when nothing reached the database.
//
// This STILL THROWS. That is deliberate and load-bearing: mrSaveReason(), saveApptSheet() and
// removeAppt() wrap their calls in try/catch to keep their sheet open and show an honest inline
// error. An earlier version of this patch swallowed the error and returned false, which silently
// disarmed all three of those handlers -- caught by reason-test.mjs (ERROR-is-recoverable), not
// by inspection. Raise the banner, then rethrow so every existing handler behaves exactly as before.
async function addEntryDB(entry) {
  try {
    await addDoc(col, entry);
  } catch (err) {
    console.warn('[write] entry was rejected:', err);
    // A toast vanishes in seconds. "Your dose did not save" must stay on screen until acknowledged.
    setState({ writeError: "That didn't save. Nothing was lost — check your connection and log it again." });
    throw err;
  }
}
async function removeEntryDB(id) { await deleteDoc(doc(db, COL_NAME, id)); }
// clearAllDB removed - history must be preserved

const PREFS_DOC = doc(db, PREFS_COL_NAME, 'settings');
function subscribePrefs(callback) {
  return onSnapshot(PREFS_DOC, (snap) => { callback(snap.exists() ? snap.data() : {}); });
}
async function clearMissedDoses() {
  const ts = state.now;
  try {
    await setDoc(PREFS_DOC, { missedClearedAt: ts }, { merge: true });
    setToast('Missed doses cleared');
  } catch (e) {
    setToast('Could not save — check connection and try again');
  }
}

// ---------- React via htm + preact-like approach using vanilla ----------
// Using a minimal reactive approach with vanilla JS for zero build step

const DEFAULT_MEDS = [
  { id:'dexamethasone', name:'Dexamethasone', sub:'Steroid · chemo premed', type:'win', alerts:true, chemoOnly:true, note:'2 tablets · 8 AM & 2 PM · day before chemo through day after',
    doses:[{label:'2 tablets',pills:2,mg:0}],
    windows:[{start:8,end:12,name:'Morning'},{start:14,end:18,name:'Afternoon'}] },
  { id:'tylenol', name:'Tylenol', sub:'Acetaminophen', type:'gap', gapH:4, ceiling:true, ceilingGroup:'tylenol', painScale:true, note:'Min 4-hour gap',
    doses:[{label:'500 mg',mg:500},{label:'1000 mg',mg:1000}] },
  { id:'tylenol-liquid', name:'Tylenol Liquid', sub:'Acetaminophen · Oral suspension', type:'gap', gapH:6, ceiling:true, ceilingGroup:'tylenol', volumeCeilingMl:90, volumePerDoseMl:30, painScale:true, note:'Min 6-hour gap · shares daily limit with Tylenol · max 90 mL/24h',

  { id:'morphine', name:'Morphine', sub:'Immediate release', type:'gap', gapH:4, ceiling:true, ceilingMax:15, rollingCeilingH:4, note:'Up to 15 mg per rolling 4-hour window', painScale:true,

  { id:'lidocaine', name:'Lidocaine', sub:'Topical cream', type:'gap', gapH:4, ceiling:true, ceilingMax:4, ceilingUnit:'applications', note:'Min 4-hour gap · max 4 applications/day',

  { id:'protonix', name:'Protonix', sub:'Pantoprazole', type:'win', alerts:true, note:'Twice daily · 8 AM & 8 PM',
    windows:[{start:8,end:12,name:'Morning'},{start:20,end:22,name:'Evening'}] },
  { id:'buspirone', name:'Buspirone', sub:'BuSpar', type:'win', alerts:true, morningLinkedToProtonix:true, note:'Once daily · with Protonix',
    windows:[{start:10,end:24,name:'Morning'}] },
  { id:'paroxetine', name:'Paroxetine', sub:'Paxil', type:'win', alerts:true, morningLinkedToProtonix:true, note:'Once daily · with Protonix',
    windows:[{start:10,end:24,name:'Morning'}] },
  { id:'iron', name:'Iron', sub:'Ferrous sulfate', type:'win', alerts:true, eveningLinkedToProtonix:true, note:'Once daily · with Protonix',
    windows:[{start:22,end:24,name:'Night'}] },
  { id:'senokot', name:'Senokot', sub:'Senna', type:'gap', gapH:0, note:'As needed · 1–2 pills',
    doses:[{label:'1 pill',pills:1,mg:0},{label:'2 pills',pills:2,mg:0}] },
  { id:'imodium', name:'Imodium', sub:'Loperamide', type:'gap', gapH:0, ceiling:true, ceilingMax:4, ceilingUnit:'pills', note:'Max 4 pills per day',
    doses:[{label:'2 pills (onset)',pills:2,mg:0},{label:'1 pill',pills:1,mg:0}] },
];

// Medication configuration is intentionally browser-local (per-device), not synced via Firestore.
// Dose-entry history remains in Firestore; configuration changes do not create a new collection.
const MED_CONFIG_STORAGE_KEY = 'caretracker-medication-config-v1';
const DEFAULT_QUICK_LOG_IDS = ['dexamethasone', 'tylenol', 'tylenol-liquid', 'zofran', 'morphine', 'lidocaine', 'protonix', 'senokot', 'imodium'];
const DEFAULT_EVENING_IDS = ['iron', 'compazine'];
const DEFAULT_MORNING_IDS = ['buspirone', 'paroxetine'];

function deepCopyMeds(meds) {
  return meds.map(med => ({
    ...med,
    doses: Array.isArray(med.doses) ? med.doses.map(dose => ({ ...dose })) : undefined,
    windows: Array.isArray(med.windows) ? med.windows.map(window => ({ ...window })) : undefined
  }));
}

function safeMedicationId(value, fallback) {
  const cleaned = String(value || fallback || 'medication').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  return cleaned || 'medication';
}

function normalizeMedication(raw, index) {
  const original = raw || {};
  const id = safeMedicationId(original.id, original.name || ('medication-' + (index + 1)));
  const type = original.type === 'win' ? 'win' : 'gap';
  const doses = Array.isArray(original.doses) ? original.doses.filter(dose => dose && dose.label).map(dose => ({
    label: String(dose.label),
    mg: Number(dose.mg) || 0,
    ...(Number(dose.pills) ? { pills: Number(dose.pills) } : {})
  })) : undefined;
  const windows = Array.isArray(original.windows) ? original.windows.map((window, windowIndex) => ({
    start: Math.max(0, Math.min(23, Number(window.start) || 0)),
    end: Math.max(1, Math.min(24, Number(window.end) || 24)),
    name: String(window.name || ('Window ' + (windowIndex + 1)))
  })).filter(window => window.end > window.start) : [];
  const medication = {
    ...original,
    id,
    name: String(original.name || 'Untitled medication').trim(),
    sub: String(original.sub || '').trim(),
    type,
    gapH: type === 'gap' ? Math.max(0, Number(original.gapH) || 0) : 0,
    quickLog: typeof original.quickLog === 'boolean' ? original.quickLog : DEFAULT_QUICK_LOG_IDS.includes(id),
    groupedEvening: typeof original.groupedEvening === 'boolean' ? original.groupedEvening : DEFAULT_EVENING_IDS.includes(id),
    groupedMorning: typeof original.groupedMorning === 'boolean' ? original.groupedMorning : DEFAULT_MORNING_IDS.includes(id)
  };
  if (doses && doses.length) medication.doses = doses; else delete medication.doses;
  if (type === 'win') medication.windows = windows.length ? windows : [{ start: 0, end: 24, name: 'Daily' }]; else delete medication.windows;
  return medication;
}

function normalizeArchivedMeds(raw) {
  const archived = {};
  if (!raw || typeof raw !== 'object') return archived;
  Object.entries(raw).forEach(([id, value]) => {
    if (!value || typeof value !== 'object') return;
    archived[id] = { name: String(value.name || id), sub: String(value.sub || '') };
  });
  return archived;
}

function defaultMedicationConfig() {
  return { meds: deepCopyMeds(DEFAULT_MEDS).map(normalizeMedication), archivedMeds: {} };
}

// v37 one-shot migration: Senokot became plain as-needed with 1- or 2-pill options.
// Saved device configs still carrying the old windowed Senokot get the fresh default;
// fires only while the saved med is still type 'win', so later manual edits persist.
function migrateSenokotV37(med) {
  if (!med || med.id !== 'senokot' || med.type === 'gap') return med;
  return normalizeMedication(deepCopyMeds(DEFAULT_MEDS.filter(m => m.id === 'senokot'))[0]);
}

// A saved device config is a point-in-time snapshot of the FULL med list — it does not automatically
// pick up medications added to DEFAULT_MEDS after that snapshot was taken (e.g. Tylenol Liquid, added
// well after most devices had already saved a config from editing some other medication). Without this
// merge, a brand-new default medication would silently never appear on any device with an existing
// saved config, even though it renders fine on a fresh/no-saved-config session. Any DEFAULT_MEDS entry
// whose id isn't already present in the saved list AND isn't archived (deliberately deleted) gets
// appended, in DEFAULT_MEDS order at the end; existing customizations for meds already present are
// left untouched.
function mergeMissingDefaultMeds(meds, archivedMeds) {
  const known = new Set(meds.map(m => m.id));
  const archivedIds = new Set(Object.keys(archivedMeds || {}));
  const missing = DEFAULT_MEDS.filter(m => !known.has(m.id) && !archivedIds.has(m.id));
  if (!missing.length) return meds;
  return meds.concat(deepCopyMeds(missing).map(normalizeMedication));
}

function loadMedicationConfig() {
  const fallback = defaultMedicationConfig();
  try {
    if (typeof localStorage === 'undefined') return fallback;
    const saved = JSON.parse(localStorage.getItem(MED_CONFIG_STORAGE_KEY));
    if (!saved || !Array.isArray(saved.meds) || !saved.meds.length) return fallback;
    const archivedMeds = normalizeArchivedMeds(saved.archivedMeds);
    const meds = mergeMissingDefaultMeds(saved.meds.map(normalizeMedication).map(migrateSenokotV37), archivedMeds);
    return { meds, archivedMeds };
  } catch (error) {
    console.warn('Medication configuration could not be loaded:', error);
    return fallback;
  }
}

function persistMedicationConfig(meds, archivedMeds) {
  // The local copy is now a CACHE of the shared list, not the source of truth.  The early return
  // that used to sit inside this try block was moved into the condition on purpose: a device with
  // no usable localStorage must still publish its change to the other phone, and returning early
  // silently skipped that.
  try {
    if (typeof localStorage !== 'undefined') {
      localStorage.setItem(MED_CONFIG_STORAGE_KEY, JSON.stringify({ version: 1, meds, archivedMeds }));
    }
  } catch (error) {
    console.warn('Medication configuration could not be saved:', error);
    setToast('Medication changes are active for this session but could not be saved on this device.');
  }
  // The single choke point.  Every medication edit in this app -- the editor, reordering, removing
  // a medication, and the archived-name merge that restore performs -- reaches Firestore through
  // this one line, which is why a later edit on either phone cannot cause the two to diverge again.
  medsyncPublishLocalChange(meds, archivedMeds);
}

// ---------------- Shared medication settings ----------------
// MEDSYNC-PATCH-MARK
//
// THE DEFECT THIS EXISTS TO FIX, in Aaron's words: the same logged dose, at the same timestamp,
// shows "Waiting" on one phone and "Available" on the other. The mechanism is medState():
//
//     const at = last.ts + med.gapH * 3600000;
//     return { locked: now < at, availableAt: at };
//
// med.gapH comes from THAT DEVICE'S OWN copy of the medication list, which lived only in
// localStorage under 'caretracker-medication-config-v1'. Dose entries synced; the configuration
// that interprets them did not. There is a second path with the same cause -- a medication whose
// copy carries rollingCeilingH returns { locked: false } unconditionally, so that device always
// says Available. The failure mode is a DOUBLE DOSE: one phone invites a dose the other phone
// knows was already taken.
//
// WHERE THE SHARED LIST LIVES. In the EXISTING caretracker_prefs/settings document, written with
// the exact setDoc(..., { merge: true }) the app already uses for missedClearedAt. Deliberately
// NOT a new collection: the published Firestore rules match named collections, so a new one fails
// silently on the live app while passing in every harness. That mistake has been made here before.
// caretracker_entries is append-only and holds no configuration; nothing below writes to it.
//
// WHY A JSON STRING AND NOT A NESTED OBJECT. Firestore's merge:true DEEP-MERGES maps. Stored as an
// object, a medication REMOVED from archivedMeds on one phone would silently fail to be removed on
// the other -- the exact class of bug this patch exists to end. A string is a scalar and is
// replaced whole. It also side-steps two real hazards: JSON.stringify drops undefined, and the
// medication editor can legitimately produce ceilingUnit: undefined, which Firestore rejects
// outright with a thrown error.
//
// NOBODY'S LIST IS DESTROYED. Two independent, recoverable copies exist before anything is
// adopted:
//   1. localStorage 'caretracker-medication-config-prechoice-v1' on each phone, written ONCE and
//      never overwritten -- that phone's list exactly as it was before it first adopted a shared
//      one;
//   2. medConfigDevices.<deviceId> in the prefs document, this device's own pre-share list, frozen
//      the moment a shared list exists and never rewritten after that.
// Both are reachable from the chooser screen as a button, so recovery is not a support call.
//
// NOTHING IS AUTO-MERGED AND NO WINNER IS PICKED SILENTLY. A newest-timestamp-wins merge on a
// chemotherapy app could overwrite the correct list with the damaged one and nobody would see it
// happen. medConfigJson is written by exactly one code path that a person can reach: the confirm
// button in renderMedsyncConfirm(). Until that button is pressed, every phone keeps running on its
// own list, unchanged.
//
// OFFLINE NEVER BLOCKS DOSING. Nothing here is awaited on any render path. If the prefs snapshot
// never arrives, state.medsync.devices stays null, the card does not appear, and the phone runs on
// its local list exactly as it does today. Every write is fire-and-forget with its own catch.

const MEDSYNC_SHARED_FIELD = 'medConfigJson';
const MEDSYNC_DEVICES_FIELD = 'medConfigDevices';
const MEDSYNC_SET_AT_FIELD = 'medConfigSetAt';
const MEDSYNC_SET_BY_FIELD = 'medConfigSetBy';
const MEDSYNC_DEVICE_ID_KEY = 'caretracker-device-id-v1';
const MEDSYNC_PRECHOICE_KEY = 'caretracker-medication-config-prechoice-v1';

// The shared string this device has already adopted. Compared by value so an echo of our own write
// is a no-op instead of a second repaint, and so mergeMissingDefaultMeds() -- which can legitimately
// make the local list differ from the shared string -- cannot cause an adopt loop.
let medsyncAppliedJson = null;
// A shared list that landed while the medication editor was open. Applied by setState() the moment
// the editor closes, never underneath a half-typed form.
let medsyncPendingShared = null;
let medsyncDeviceIdCache = null;
let medsyncBusy = false;

function medsyncLsGet(key) {
  try { return (typeof localStorage === 'undefined') ? null : localStorage.getItem(key); } catch (err) { return null; }
}
function medsyncLsSet(key, value) {
  try { if (typeof localStorage === 'undefined') return false; localStorage.setItem(key, value); return true; } catch (err) { return false; }
}

// Stable across sessions so a phone owns exactly one entry in medConfigDevices. If storage is
// unreadable (private mode) the id is per-session, which means that phone re-publishes a candidate
// each session; it still never overwrites another phone's entry and never touches a frozen one.
function medsyncDeviceId() {
  if (medsyncDeviceIdCache) return medsyncDeviceIdCache;
  let id = medsyncLsGet(MEDSYNC_DEVICE_ID_KEY);
  if (typeof id !== 'string' || id.length < 8) {
    id = 'dev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    medsyncLsSet(MEDSYNC_DEVICE_ID_KEY, id);
  }
  medsyncDeviceIdCache = id;
  return id;
}

function medsyncDeviceLabel() {
  const ua = (typeof navigator !== 'undefined' && navigator.userAgent) ? String(navigator.userAgent) : '';
  if (/iPad/i.test(ua)) return 'iPad';
  if (/iPhone|iPod/i.test(ua)) return 'iPhone';
  if (/Android/i.test(ua)) return 'Android phone';
  if (/Macintosh|Mac OS X/i.test(ua)) return 'Mac';
  if (/Windows/i.test(ua)) return 'Windows PC';
  return 'Phone';
}

// Key order out of JSON.stringify follows insertion order, which differs between a list that was
// typed in the editor and the same list round-tripped through Firestore. Two identical lists must
// produce one identical string or every comparison below becomes a coin toss, so keys are sorted.
// Array order is NOT sorted: state.meds order is what drives Home's Quick Log card order.
function medsyncStableStringify(value) {
  if (value === undefined) return 'null';
  if (value === null || typeof value !== 'object') return JSON.stringify(value);
  if (Array.isArray(value)) return '[' + value.map(medsyncStableStringify).join(',') + ']';
  const keys = Object.keys(value).filter((k) => value[k] !== undefined).sort();
  return '{' + keys.map((k) => JSON.stringify(k) + ':' + medsyncStableStringify(value[k])).join(',') + '}';
}

function medsyncConfigJson(meds, archivedMeds) {
  const list = Array.isArray(meds) ? meds : [];
  const arch = (archivedMeds && typeof archivedMeds === 'object') ? archivedMeds : {};
  return medsyncStableStringify({ version: 1, meds: list, archivedMeds: arch });
}

function medsyncCurrentJson() { return medsyncConfigJson(state.meds, state.archivedMeds); }

// Returns null for anything that is not a usable medication list. An EMPTY meds array is refused
// on purpose: a truncated or half-written shared document must never be able to wipe a phone's
// medication list. Refusing leaves that phone on its own list, which is the safe outcome.
function medsyncParseConfig(json) {
  if (typeof json !== 'string' || !json) return null;
  let raw;
  try { raw = JSON.parse(json); } catch (err) { return null; }
  if (!raw || typeof raw !== 'object' || !Array.isArray(raw.meds) || !raw.meds.length) return null;
  const meds = raw.meds.filter((m) => m && typeof m === 'object').map(normalizeMedication);
  if (!meds.length) return null;
  return { meds: meds, archivedMeds: normalizeArchivedMeds(raw.archivedMeds) };
}

// Object.create(null), not {}. A map keyed by ids that inherits Object.prototype answers truthy for
// 'constructor', 'toString' and friends even when it is EMPTY -- a blocker of exactly this kind was
// already found in restore on this app. Every read below goes through hasOwnProperty as well.
function medsyncOwn(map, key) {
  return (map && Object.prototype.hasOwnProperty.call(map, key)) ? map[key] : null;
}

function medsyncReadDevices(raw) {
  const out = Object.create(null);
  if (!raw || typeof raw !== 'object') return out;
  Object.keys(raw).forEach((id) => {
    const v = raw[id];
    if (!v || typeof v !== 'object' || typeof v.json !== 'string') return;
    if (!medsyncParseConfig(v.json)) return;
    out[id] = { id: id, label: String(v.label || 'Phone'), json: v.json, at: Number(v.at) || 0, frozen: !!v.frozen };
  });
  return out;
}

// Written once and NEVER overwritten: the point of this file is that the list a phone had before it
// ever adopted a shared one is still there afterwards.
function medsyncBackupLocalOnce() {
  if (medsyncLsGet(MEDSYNC_PRECHOICE_KEY)) return false;
  return medsyncLsSet(MEDSYNC_PRECHOICE_KEY, JSON.stringify({ version: 1, savedAt: Date.now(), app: APP_VERSION, config: medsyncCurrentJson() }));
}

function medsyncPreShareJson() {
  const raw = medsyncLsGet(MEDSYNC_PRECHOICE_KEY);
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed.config === 'string' && medsyncParseConfig(parsed.config)) return parsed.config;
    } catch (err) { /* fall through to the live list */ }
  }
  return medsyncCurrentJson();
}

// The local mirror of the shared list. Written directly rather than through
// persistMedicationConfig() so that adopting a list can never publish it straight back out.
function medsyncCacheLocal(meds, archivedMeds) {
  medsyncLsSet(MED_CONFIG_STORAGE_KEY, JSON.stringify({ version: 1, meds: meds, archivedMeds: archivedMeds }));
}

function medsyncWritePrefs(payload) {
  try {
    return Promise.resolve(setDoc(PREFS_DOC, payload, { merge: true }))
      .then(function () { return true; }, function (err) { console.warn('[medsync] prefs write failed:', err); return false; });
  } catch (err) {
    console.warn('[medsync] prefs write threw:', err);
    return Promise.resolve(false);
  }
}

function medsyncWriteCandidate(json, frozen) {
  const id = medsyncDeviceId();
  const entry = {};
  entry[id] = { label: medsyncDeviceLabel(), json: json, at: Date.now(), frozen: !!frozen, app: APP_VERSION };
  const payload = {};
  payload[MEDSYNC_DEVICES_FIELD] = entry;
  return medsyncWritePrefs(payload);
}

function medsyncAdopt(cfg, json) {
  medsyncBackupLocalOnce();
  const archivedMeds = normalizeArchivedMeds(cfg.archivedMeds);
  // mergeMissingDefaultMeds is kept because it is how a medication added to DEFAULT_MEDS in a later
  // release ever reaches a phone that already has a saved list. Both phones run the same merge over
  // the same shared string, so they still land on the same list; medsyncAppliedJson holds the
  // SHARED string, not the merged one, so the difference cannot start an adopt loop.
  const meds = mergeMissingDefaultMeds(cfg.meds.map(normalizeMedication).map(migrateSenokotV37), archivedMeds);
  medsyncCacheLocal(meds, archivedMeds);
  medsyncAppliedJson = json;
  return { meds: meds, archivedMeds: archivedMeds };
}

// Called from the prefs snapshot. Mutates the caller's patch rather than calling setState itself, so
// one snapshot produces exactly one repaint.
function medsyncOnPrefs(prefs, patch) {
  const raw = (prefs && typeof prefs === 'object') ? prefs : {};
  const devices = medsyncReadDevices(raw[MEDSYNC_DEVICES_FIELD]);
  const sharedRaw = raw[MEDSYNC_SHARED_FIELD];
  const sharedJson = (typeof sharedRaw === 'string' && medsyncParseConfig(sharedRaw)) ? sharedRaw : null;
  patch.medsync = Object.assign({}, state.medsync, {
    devices: devices,
    sharedJson: sharedJson,
    setAt: Number(raw[MEDSYNC_SET_AT_FIELD]) || 0,
    setBy: String(raw[MEDSYNC_SET_BY_FIELD] || ''),
    saving: false
  });
  if (sharedJson && sharedJson !== medsyncAppliedJson) {
    const cfg = medsyncParseConfig(sharedJson);
    if (cfg) {
      if (state.medEditor) {
        medsyncPendingShared = { cfg: cfg, json: sharedJson };
      } else {
        const applied = medsyncAdopt(cfg, sharedJson);
        patch.meds = applied.meds;
        patch.archivedMeds = applied.archivedMeds;
      }
    }
  }
  medsyncPublishCandidate(devices, sharedJson);
}

function medsyncPublishCandidate(devices, sharedJson) {
  const mine = medsyncOwn(devices, medsyncDeviceId());
  if (sharedJson) {
    // Frozen. A phone that first opened the app AFTER the choice was made still gets its own
    // pre-adoption list recorded here, exactly once, so it is recoverable too.
    if (mine) return;
    medsyncWriteCandidate(medsyncPreShareJson(), true);
    return;
  }
  const json = medsyncCurrentJson();
  if (mine && mine.json === json) return;
  medsyncWriteCandidate(json, false);
}

// The one call persistMedicationConfig() makes. Once a shared list exists, every later edit on
// either phone writes the whole list to the shared field, so they cannot drift apart again.
function medsyncPublishLocalChange(meds, archivedMeds) {
  const m = state.medsync;
  if (!m) return;
  const json = medsyncConfigJson(meds, archivedMeds);
  if (m.sharedJson) {
    if (json === medsyncAppliedJson) return;
    medsyncAppliedJson = json;
    state.medsync = Object.assign({}, m, { sharedJson: json, setAt: Date.now(), setBy: medsyncDeviceLabel() });
    const payload = {};
    payload[MEDSYNC_SHARED_FIELD] = json;
    payload[MEDSYNC_SET_AT_FIELD] = Date.now();
    payload[MEDSYNC_SET_BY_FIELD] = medsyncDeviceLabel();
    medsyncWritePrefs(payload).then(function (ok) {
      if (!ok) setToast('Saved on this phone, but the other phone could not be updated — check the connection.');
    });
    return;
  }
  // No shared list yet, and prefs have not loaded: stay entirely local. Nothing is blocked.
  if (!m.devices) return;
  const mine = medsyncOwn(m.devices, medsyncDeviceId());
  if (mine && mine.json === json) return;
  medsyncWriteCandidate(json, false);
}

// ---- The choice ----

// The ONLY writer of the shared field. Nothing else in this app can set a source of truth.
function medsyncCommitChoice(json, label) {
  const cfg = medsyncParseConfig(json);
  if (!cfg) { setToast('That medication list could not be read — nothing was changed.'); return; }
  if (medsyncBusy) return;
  medsyncBusy = true;
  const at = Date.now();
  const by = String(label || medsyncDeviceLabel());
  setState({ medsync: Object.assign({}, state.medsync, { saving: true }) });
  const payload = {};
  payload[MEDSYNC_SHARED_FIELD] = json;
  payload[MEDSYNC_SET_AT_FIELD] = at;
  payload[MEDSYNC_SET_BY_FIELD] = by;
  medsyncWritePrefs(payload).then(function (ok) {
    medsyncBusy = false;
    if (!ok) {
      // Nothing local was touched. A failed write leaves both phones exactly as they were.
      setState({ medsync: Object.assign({}, state.medsync, { saving: false }) });
      setToast('Could not save — check the connection and try again. Nothing was changed.');
      return;
    }
    const applied = medsyncAdopt(cfg, json);
    setState({
      meds: applied.meds,
      archivedMeds: applied.archivedMeds,
      view: 'meds',
      medEditor: null,
      confirmDeleteMed: null,
      medsync: Object.assign({}, state.medsync, { saving: false, confirm: null, sharedJson: json, setAt: at, setBy: by })
    });
    setToast('Medication settings are now shared. Both phones use this list.');
    window.scrollTo(0, 0);
  });
}

// Navigation in and out of the chooser always clears a half-open confirm panel, so returning to
// the screen never lands on a confirmation Aaron did not just ask for.
function medsyncGoChooser() {
  setState({ view: 'medsync', medEditor: null, confirmDeleteMed: null, medsync: Object.assign({}, state.medsync, { confirm: null }) });
  window.scrollTo(0, 0);
}

function medsyncGoMeds() {
  setState({ view: 'meds', medEditor: null, confirmDeleteMed: null, medsync: Object.assign({}, state.medsync, { confirm: null }) });
  window.scrollTo(0, 0);
}

function medsyncOpenConfirm(cand) {
  setState({ medsync: Object.assign({}, state.medsync, { confirm: { id: cand.id, label: cand.label, json: cand.json, mine: cand.id === medsyncDeviceId() } }) });
  window.scrollTo(0, 0);
}

function medsyncCloseConfirm() {
  setState({ medsync: Object.assign({}, state.medsync, { confirm: null }) });
}

// This phone always appears in the list even before its own candidate write has landed, so the
// chooser is never a screen with one option on it.
function medsyncCandidates() {
  const m = state.medsync || {};
  const devices = m.devices || Object.create(null);
  const myId = medsyncDeviceId();
  const list = Object.keys(devices).map(function (k) { return devices[k]; });
  if (!medsyncOwn(devices, myId)) list.push({ id: myId, label: medsyncDeviceLabel(), json: medsyncPreShareJson(), at: Date.now(), frozen: false });
  list.sort(function (a, b) {
    if (a.id === myId) return -1;
    if (b.id === myId) return 1;
    return (b.at || 0) - (a.at || 0);
  });
  return list;
}

// ---- Difference report ----

const MEDSYNC_FIELD_INFO = Object.assign(Object.create(null), {
  name: { label: 'Name' },
  sub: { label: 'Generic name' },
  note: { label: 'Note' },
  type: { label: 'How it is scheduled', critical: true, fmt: function (v) { return v === 'win' ? 'at set times' : 'as needed, with a gap'; } },
  gapH: { label: 'Smallest gap between doses', critical: true, fmt: function (v) { return Number(v) > 0 ? (medsyncNum(v) + ' hours') : 'no gap'; } },
  rollingCeilingH: { label: 'Rolling limit window', critical: true, fmt: function (v) { return Number(v) > 0 ? (medsyncNum(v) + ' hours') : 'none'; } },
  doses: { label: 'Dose options', critical: true, fmt: medsyncFmtDoses },
  windows: { label: 'Times of day', critical: true, fmt: medsyncFmtWindows },
  ceiling: { label: 'Has a limit', fmt: medsyncFmtYesNo },
  ceilingMax: { label: 'Limit amount', fmt: function (v) { return Number(v) > 0 ? medsyncNum(v) : 'none'; } },
  ceilingUnit: { label: 'Limit counted in', fmt: function (v) { return String(v || 'mg'); } },
  ceilingGroup: { label: 'Shares its limit with', fmt: function (v) { return v ? String(v) : 'nothing'; } },
  volumeCeilingMl: { label: 'Liquid limit per day (mL)', fmt: function (v) { return Number(v) > 0 ? medsyncNum(v) : 'none'; } },
  volumePerDoseMl: { label: 'Liquid per dose (mL)', fmt: function (v) { return Number(v) > 0 ? medsyncNum(v) : 'none'; } },
  chemoOnly: { label: 'Chemo days only', fmt: medsyncFmtYesNo },
  quickLog: { label: 'Has its own card on Home', fmt: medsyncFmtYesNo },
  groupedMorning: { label: 'In the morning group', fmt: medsyncFmtYesNo },
  groupedEvening: { label: 'In the evening group', fmt: medsyncFmtYesNo },
  alerts: { label: 'Missed-dose alerts', fmt: medsyncFmtYesNo },
  painScale: { label: 'Asks for a pain score', fmt: medsyncFmtYesNo },
  morningLinkedToProtonix: { label: 'Follows the morning group', fmt: medsyncFmtYesNo },
  eveningLinkedToProtonix: { label: 'Follows the evening group', fmt: medsyncFmtYesNo }
});

function medsyncNum(v) {
  const n = Number(v);
  if (!isFinite(n)) return String(v);
  return String(Math.round(n * 100) / 100);
}
function medsyncFmtYesNo(v) { return v ? 'yes' : 'no'; }
function medsyncFmtDoses(v) {
  if (!Array.isArray(v) || !v.length) return 'none';
  return v.map(function (d) { return (d && d.label) ? String(d.label) : '—'; }).join(', ');
}
function medsyncHour(v) {
  const n = Number(v);
  if (!isFinite(n)) return String(v);
  if (n <= 0 || n >= 24) return 'midnight';
  if (n === 12) return 'noon';
  return (n < 12 ? n + ' AM' : (n - 12) + ' PM');
}
function medsyncFmtWindows(v) {
  if (!Array.isArray(v) || !v.length) return 'none';
  return v.map(function (w) { return (w && w.name ? String(w.name) + ' ' : '') + medsyncHour(w && w.start) + '–' + medsyncHour(w && w.end); }).join(', ');
}
function medsyncFieldInfo(key) {
  const known = medsyncOwn(MEDSYNC_FIELD_INFO, key);
  if (known) return known;
  return { label: 'Setting “' + key + '”', fmt: function (v) { return medsyncStableStringify(v); } };
}
function medsyncFmtValue(key, value) {
  const info = medsyncFieldInfo(key);
  const out = info.fmt ? info.fmt(value) : (value === undefined || value === null || value === '' ? 'not set' : String(value));
  return (out === undefined || out === null || out === '') ? 'not set' : String(out);
}

function medsyncMedMap(cfg) {
  const map = Object.create(null);
  (cfg.meds || []).forEach(function (m) { if (m && m.id) map[m.id] = m; });
  return map;
}

function medsyncFieldDiffs(a, b) {
  const keys = [];
  Object.keys(a || {}).forEach(function (k) { if (k !== 'id' && keys.indexOf(k) < 0) keys.push(k); });
  Object.keys(b || {}).forEach(function (k) { if (k !== 'id' && keys.indexOf(k) < 0) keys.push(k); });
  const rows = [];
  keys.forEach(function (k) {
    if (medsyncStableStringify(a ? a[k] : undefined) === medsyncStableStringify(b ? b[k] : undefined)) return;
    const info = medsyncFieldInfo(k);
    rows.push({ key: k, label: info.label, critical: !!info.critical, a: medsyncFmtValue(k, a ? a[k] : undefined), b: medsyncFmtValue(k, b ? b[k] : undefined) });
  });
  rows.sort(function (x, y) { return (y.critical ? 1 : 0) - (x.critical ? 1 : 0); });
  return rows;
}

function medsyncDiff(aJson, bJson) {
  const out = { ok: false, onlyA: [], onlyB: [], changed: [], archivedOnlyA: [], archivedOnlyB: [], count: 0 };
  const A = medsyncParseConfig(aJson);
  const B = medsyncParseConfig(bJson);
  if (!A || !B) return out;
  out.ok = true;
  const ma = medsyncMedMap(A);
  const mb = medsyncMedMap(B);
  const ids = [];
  (A.meds || []).forEach(function (m) { if (ids.indexOf(m.id) < 0) ids.push(m.id); });
  (B.meds || []).forEach(function (m) { if (ids.indexOf(m.id) < 0) ids.push(m.id); });
  ids.forEach(function (id) {
    const a = medsyncOwn(ma, id);
    const b = medsyncOwn(mb, id);
    if (a && !b) { out.onlyA.push(a.name); return; }
    if (b && !a) { out.onlyB.push(b.name); return; }
    const fields = medsyncFieldDiffs(a, b);
    if (fields.length) out.changed.push({ id: id, name: a.name, fields: fields });
  });
  const aa = A.archivedMeds || {};
  const ab = B.archivedMeds || {};
  Object.keys(aa).forEach(function (id) { if (!medsyncOwn(ab, id)) out.archivedOnlyA.push(String(aa[id].name || id)); });
  Object.keys(ab).forEach(function (id) { if (!medsyncOwn(aa, id)) out.archivedOnlyB.push(String(ab[id].name || id)); });
  out.count = out.onlyA.length + out.onlyB.length + out.archivedOnlyA.length + out.archivedOnlyB.length +
    out.changed.reduce(function (n, c) { return n + c.fields.length; }, 0);
  return out;
}

function medsyncCountLabel(json) {
  const cfg = medsyncParseConfig(json);
  if (!cfg) return { meds: 0, archived: 0, names: [], archivedNames: [] };
  return {
    meds: cfg.meds.length,
    archived: Object.keys(cfg.archivedMeds || {}).length,
    names: cfg.meds.map(function (m) { return m.name; }),
    archivedNames: Object.keys(cfg.archivedMeds || {}).map(function (id) { return String(cfg.archivedMeds[id].name || id); })
  };
}

// fmtD in this file is a LOCAL const inside the printable-report builder, not a global; this is
// this module's own date+time label and depends on nothing outside it.
function medsyncWhen(ts) {
  const d = new Date(Number(ts) || 0);
  return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) + ', ' + fmtTime(d.getTime());
}

function medsyncAgo(at) {
  const ms = Math.max(0, (state.now || Date.now()) - (Number(at) || 0));
  const mins = Math.floor(ms / 60000);
  if (!Number(at)) return 'not seen yet';
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + (mins === 1 ? ' minute ago' : ' minutes ago');
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
  const days = Math.floor(hrs / 24);
  return days + (days === 1 ? ' day ago' : ' days ago');
}

const MEDSYNC_CARD_STYLE = { background: 'rgba(255,255,255,0.66)', backdropFilter: 'blur(16px)', WebkitBackdropFilter: 'blur(16px)', borderRadius: '17px', padding: '14px', boxShadow: '0 3px 16px rgba(180,130,150,0.09), inset 0 1px 0 rgba(255,255,255,0.75)' };
const MEDSYNC_BTN_STYLE = { width: '100%', minHeight: '48px', padding: '12px 14px', borderRadius: '13px', background: '#AA5375', color: '#fff', fontSize: '14px', fontWeight: '800', lineHeight: '1.25', boxShadow: 'inset 0 -2px 0 rgba(121,57,84,0.35)', cursor: 'pointer' };
const MEDSYNC_BTN_QUIET = { width: '100%', minHeight: '48px', padding: '12px 14px', borderRadius: '13px', background: 'rgba(255,255,255,0.62)', color: '#6E5261', border: '1px solid rgba(212,104,138,0.22)', fontSize: '14px', fontWeight: '800', lineHeight: '1.25', cursor: 'pointer' };

function medsyncListLine(label, names) {
  if (!names || !names.length) return null;
  return h('div', { style: { fontSize: '12.5px', color: '#5F4A56', lineHeight: '1.45', marginTop: '4px' } },
    h('span', { style: { fontWeight: '800', color: '#8E3D61' } }, label + ': '),
    names.join(', ')
  );
}

// The Medications-screen notice. Returns null until the prefs snapshot has arrived, so an offline
// phone shows nothing at all rather than a warning it cannot act on.
function renderMedsyncCard() {
  const m = state.medsync || {};
  if (!m.devices) return null;
  const cands = medsyncCandidates();
  const myId = medsyncDeviceId();
  const others = cands.filter(function (c) { return c.id !== myId; });

  if (m.sharedJson) {
    const when = m.setAt ? (' Set from ' + (m.setBy || 'a phone') + ' on ' + medsyncWhen(m.setAt) + '.') : '';
    return h('section', { 'data-medsync-card': 'shared', style: Object.assign({}, MEDSYNC_CARD_STYLE, { border: '1px solid rgba(12,127,87,0.24)' }) },
      h('div', { style: { fontSize: '15px', fontWeight: '800', color: '#0C7F57', letterSpacing: '-0.015em' } }, 'Medication settings are shared'),
      h('div', { style: { fontSize: '12.5px', color: '#5F4A56', lineHeight: '1.45', marginTop: '5px' } },
        'Every phone uses the same medication list. A change made on one phone shows up on the other.' + when),
      h('button', { 'data-medsync-open': 'true', type: 'button', onClick: medsyncGoChooser, style: Object.assign({}, MEDSYNC_BTN_QUIET, { marginTop: '11px' }) }, 'Change which list is used')
    );
  }

  if (!others.length) {
    // No button at all rather than a dead one. h() calls setAttribute for anything it does not
    // special-case, so `disabled: null` renders disabled="null" and the control is disabled for
    // good -- four Blockers have shipped from that on this app.
    return h('section', { 'data-medsync-card': 'alone', style: Object.assign({}, MEDSYNC_CARD_STYLE, { border: '1px solid rgba(192,69,59,0.26)' }) },
      h('div', { style: { fontSize: '15px', fontWeight: '800', color: '#A15B56', letterSpacing: '-0.015em' } }, 'Medication settings are not shared between phones'),
      h('div', { style: { fontSize: '12.5px', color: '#5F4A56', lineHeight: '1.45', marginTop: '5px' } },
        'Each phone is keeping its own medication list, so the two can disagree about when a dose is due. Only this phone has checked in so far — open CareTracker on the other phone once, then come back here.')
    );
  }

  const total = others.reduce(function (n, o) { const d = medsyncDiff(cands[0].json, o.json); return n + (d.ok ? d.count : 0); }, 0);
  const body = total > 0
    ? ('Each phone is keeping its own medication list, and they do not match. That is why the same dose can say “Waiting” on one phone and “Available” on the other. ' + total + (total === 1 ? ' difference' : ' differences') + ' found.')
    : 'Each phone is keeping its own medication list. They match right now, but they are separate copies and can drift apart again.';
  return h('section', { 'data-medsync-card': 'diverged', style: Object.assign({}, MEDSYNC_CARD_STYLE, { border: '1px solid rgba(192,69,59,0.26)' }) },
    h('div', { style: { fontSize: '15px', fontWeight: '800', color: '#A15B56', letterSpacing: '-0.015em' } }, 'Medication settings are not shared between phones'),
    h('div', { 'data-medsync-diffcount': String(total), style: { fontSize: '12.5px', color: '#5F4A56', lineHeight: '1.45', marginTop: '5px' } }, body),
    h('button', { 'data-medsync-open': 'true', type: 'button', onClick: medsyncGoChooser, style: Object.assign({}, MEDSYNC_BTN_STYLE, { marginTop: '11px' }) },
      total > 0 ? 'See what is different' : 'Set the shared list')
  );
}

function renderMedsyncDiffBlock(mineCand, otherCand) {
  const d = medsyncDiff(mineCand.json, otherCand.json);
  if (!d.ok) return null;
  const rows = [];
  if (!d.count) {
    rows.push(h('div', { style: { fontSize: '12.5px', color: '#5F4A56', lineHeight: '1.45' } }, 'These two lists are identical right now.'));
  }
  const line = medsyncListLine('On this phone only', d.onlyA);
  if (line) rows.push(line);
  const line2 = medsyncListLine('On ' + otherCand.label + ' only', d.onlyB);
  if (line2) rows.push(line2);
  const line3 = medsyncListLine('Deactivated on this phone only', d.archivedOnlyA);
  if (line3) rows.push(line3);
  const line4 = medsyncListLine('Deactivated on ' + otherCand.label + ' only', d.archivedOnlyB);
  if (line4) rows.push(line4);
  d.changed.forEach(function (c) {
    rows.push(h('div', { 'data-medsync-changed': c.id, style: { marginTop: '9px', paddingTop: '8px', borderTop: '1px solid rgba(212,104,138,0.14)' } },
      h('div', { style: { fontSize: '13px', fontWeight: '800', color: '#342530' } }, c.name),
      ...c.fields.map(function (f) {
        return h('div', { style: { fontSize: '12px', color: '#5F4A56', lineHeight: '1.45', marginTop: '3px' } },
          h('span', { style: { fontWeight: '800', color: f.critical ? '#A15B56' : '#8E3D61' } }, f.label + ': '),
          'this phone says ' + f.a + ', ' + otherCand.label + ' says ' + f.b,
          f.critical ? h('span', { style: { display: 'block', fontSize: '11px', color: '#A15B56', fontWeight: '700' } }, 'This one changes when a dose is allowed.') : null
        );
      })
    ));
  });
  return h('section', { 'data-medsync-diff': otherCand.id, style: Object.assign({}, MEDSYNC_CARD_STYLE, { border: '1px solid rgba(212,104,138,0.18)' }) },
    h('div', { style: { fontSize: '12px', fontWeight: '800', letterSpacing: '0.04em', textTransform: 'uppercase', color: '#8E3D61' } }, 'What is different between them'),
    h('div', { style: { fontSize: '11.5px', color: '#6E5261', marginTop: '3px', marginBottom: '7px' } }, 'This phone compared with ' + otherCand.label),
    ...rows
  );
}

  const entryDay = dayStart(ts);
  const time = new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const weekday = new Date(ts).toLocaleDateString([], { weekday: 'long' });
  const md = (new Date(ts).getMonth() + 1) + '/' + new Date(ts).getDate();
  if (entryDay === d0) {
    return 'Today - ' + weekday + ' ' + md + ' at ' + time;
  }
  return weekday + ', ' + md + ' at ' + time;
}

// Protonix's evening (PM) dose log time for the given day, if logged yet — the second dose,
// after its own Morning window (8am-12pm) has closed.
function protonixEveningLogTs(d0) {
  const es = entriesFor('protonix');
  const entry = es.find(e => e.ts >= d0 + 12 * 3600000 && e.ts < d0 + 86400000);
  return entry ? entry.ts : null;
}

// Iron (and Compazine's own routine, unlinked) open at 10 PM by default, but if Protonix's evening
// dose was logged, Iron instead opens 2 hours after that actual log time (so the two are spaced out).
function eveningWindowsFor(med, d0) {
  const pTs = protonixEveningLogTs(d0);
  if (pTs) {
    const startH = (pTs + 2 * 3600000 - d0) / 3600000;
    if (startH < 24) return [{ start: Math.max(0, startH), end: 24, name: 'Night' }];
  }
  return med.windows; // default: 10 PM
}

// Protonix's morning (AM) dose log time for the given day, if logged yet — any entry logged
// before its own Evening window opens (noon).
function protonixMorningLogTs(d0) {
  const es = entriesFor('protonix');
  const entry = es.find(e => e.ts >= d0 && e.ts < d0 + 12 * 3600000);
  return entry ? entry.ts : null;
}

// Buspirone/Paroxetine open at 10 AM by default (2h after Protonix's own default 8 AM dose time),
// but if Protonix's actual morning dose was logged, they instead open 2 hours after that real log
// time and stay open through end of day (mirrors eveningWindowsFor's pattern for Iron exactly:
// Iron defaults to 10 PM, 2h after Protonix's default 8 PM evening time, then shifts the same way).
function morningWindowsFor(med, d0) {
  const pTs = protonixMorningLogTs(d0);
  if (pTs) {
    const startH = (pTs + 2 * 3600000 - d0) / 3600000;
    if (startH < 24) return [{ start: Math.max(0, startH), end: 24, name: 'Morning' }];
  }
  return med.windows; // default: 10 AM–midnight
}

function status(med) {
  const now = state.now;
  if (med.id === 'zofran' && zofranBlockedOn(now)) {
    // 3-day block (chemo day + 2 following days, see zofranBlockedOn) — opens on day+3 at 8am.
    return { locked: true, chemoBlock: true, availableAt: dayStart(nextChemoTs()) + 3 * 86400000 + 8 * 3600000 };
  }
  const es = entriesFor(med.id).slice().sort((a, b) => a.ts - b.ts);
  if (med.type === 'gap') {
    // Check daily ceiling first (Tylenol mg or Imodium pills)
    if (med.ceiling) {
      const dc = dailyCeiling(med);
      if (dc && dc.used >= dc.max) {
        if (med.rollingCeilingH) {
          // Rolling-window ceiling (e.g. Morphine's 15 mg / 4h): the lockout self-resolves as old
          // doses age out of the window, not at midnight — compute the actual next-available time.
          return { locked: true, ceilingHit: true, rollingCeiling: true, ceilingLabel: dc.label, availableAt: rollingCeilingAvailableAt(med) };
        }
        return { locked: true, ceilingHit: true, ceilingLabel: dc.label };
      }
    }
    // Form-specific volume cap (e.g. Tylenol Liquid's 90 mL/24h) — independent of the mg ceiling
    if (med.volumeCeilingMl) {
      const vc = dailyVolumeCeiling(med);
      if (vc && vc.used >= vc.max) {
        return { locked: true, ceilingHit: true, ceilingLabel: vc.label };
      }
    }
    // Rolling-ceiling meds (Morphine) are gated solely by the mg ceiling above — a half dose must
    // NOT trigger a flat gapH lockout the way a full dose does, since there's still 7.5 mg of room
    // left in the 4-hour window. Per-dose-button blocking (doseBlocked, in the render loop) still
    // prevents logging a dose that would push the rolling total over the ceiling.
    if (med.rollingCeilingH) return { locked: false };
    const last = es[es.length - 1];
    if (!last) return { locked: false };
    const at = last.ts + med.gapH * 3600000;
    return { locked: now < at, availableAt: at };
  }
  const d0 = dayStart(now), atH = (h) => d0 + h * 3600000;
  const windows = med.id === 'dexamethasone' ? dexWindowsForOffset(chemoOffsetFor(d0)) : med.eveningLinkedToProtonix ? eveningWindowsFor(med, d0) : med.morningLinkedToProtonix ? morningWindowsFor(med, d0) : med.windows;
  for (const w of windows) {
    const ws = atH(w.start), we = atH(w.end);
    const used = es.some(e => e.ts >= ws && e.ts < we);
    if (used) continue;
    if (now < ws) return { locked: true, availableAt: ws, windowName: w.name };
    if (now >= ws && now < we) return { locked: false, windowName: w.name };
  }
  const chemoOver = med.chemoOnly && !dexActiveOn(d0 + 86400000);
  if (chemoOver) {
    return { locked: true, courseComplete: true };
  }
  const tomorrowWindows = med.id === 'dexamethasone' ? dexWindowsForOffset(chemoOffsetFor(d0 + 86400000)) : windows;
  const first = tomorrowWindows[0];
  return { locked: true, availableAt: d0 + 86400000 + first.start * 3600000, windowName: first.name };
}

function setToast(msg) {
  setState({ toast: msg });
  clearTimeout(toastTimer);
  // A toast clears itself by repainting, and render() rebuilds the whole tree — so a toast raised
  // just before the reason sheet was opened can destroy that sheet mid-tap. The clear is DEFERRED,
  // not cancelled: it re-arms every 600ms and fires the moment the sheet closes, so the toast still
  // goes away on its own and no state is left stuck.
  toastTimer = setTimeout(function mrClearToast() {
    if (state.missReasonSheet) { toastTimer = setTimeout(mrClearToast, 600); return; }
    setState({ toast: null });
  }, 4500);
}

function afterLog(entry) {
  const twoH = 2 * 3600000;
  if (entry.medId === 'iron' || entry.medId === 'protonix') {
    const other = entry.medId === 'iron' ? 'protonix' : 'iron';
    const near = state.entries.find(e => e.medId === other && e.id !== entry.id && Math.abs(e.ts - entry.ts) <= twoH);
    if (near) { setState({ warn: { tone: 'amber', title: 'Iron + Protonix timing', body: 'Iron and Protonix were logged within 2 hours of each other. Protonix (a PPI) lowers stomach acid, which can markedly reduce iron absorption. Aim to separate the two by at least 2 hours.' } }); return; }
  }
  if (entry.medId === 'tylenol' || entry.medId === 'tylenol-liquid') {
    const mg = tylenolMg();
    const tylenol = state.meds.find(med => med.id === 'tylenol');
    const limit = medicationCeilingMax(tylenol) || CONFIG.ceilingMg;
    const mgOver = mg > limit;
    let volOver = false, vol = 0, liquidMed = null;
    if (entry.medId === 'tylenol-liquid') {
      liquidMed = state.meds.find(med => med.id === 'tylenol-liquid');
      vol = dailyVolumeMl('tylenol-liquid');
      volOver = !!(liquidMed && liquidMed.volumeCeilingMl && vol > liquidMed.volumeCeilingMl);
    }
    if (mgOver && volOver) {
      setState({ warn: { tone: 'red', title: 'Acetaminophen ceiling exceeded', body: "Today's Tylenol total is " + mg.toLocaleString() + " mg (above the " + limit.toLocaleString() + " mg daily limit) and Tylenol Liquid volume is " + vol + " mL (above the " + liquidMed.volumeCeilingMl + " mL daily limit). Do not give more without contacting the care team." } });
    } else if (mgOver) {
      setState({ warn: { tone: 'red', title: 'Acetaminophen ceiling exceeded', body: "Today's Tylenol total is " + mg.toLocaleString() + " mg, above the " + limit.toLocaleString() + " mg daily limit. Do not give more without contacting the care team." } });
    } else if (volOver) {
      setState({ warn: { tone: 'red', title: 'Tylenol Liquid volume ceiling exceeded', body: "Today's Tylenol Liquid total is " + vol + " mL, above the " + liquidMed.volumeCeilingMl + " mL daily limit. Do not give more without contacting the care team." } });
    }
  } else {
    const configuredMedication = state.meds.find(med => med.id === entry.medId);
    const configuredLimit = dailyCeiling(configuredMedication);
    if (configuredLimit && configuredLimit.used > configuredLimit.max) {
      setState({ warn: { tone: 'red', title: configuredMedication.name + ' daily limit exceeded', body: "Today's " + configuredMedication.name + ' total is ' + configuredLimit.used + ' ' + configuredLimit.unit + ', above the ' + configuredLimit.label + ' daily limit. Do not give more without contacting the care team.' } });
    }
  }
}

async function logMed(medId, dose, opts) {
  opts = opts || {};
  const med = state.meds.find(m => m.id === medId);
  const st = status(med);
  if (st.locked && !opts.force) { setState({ override: { medId } }); return; }
  setState({ override: null, timeModal: { type: 'med', medId, dose, opts, timeValue: nowLocalISO() } });
}

// Backfill a missed dose from History — opens the same log flow, pre-filled to the missed
// window's scheduled time (editable), bypassing the lock check since this IS the catch-up path.
function logMissedDose(e) {
  const med = state.meds.find(m => m.id === e.medId);
  if (!med) return;
  const dose = med.doses ? med.doses[0] : null;
  const d = new Date(e.ts);
  const pad = n => String(n).padStart(2, '0');
  const iso = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  setState({ override: null, timeModal: { type: 'med', medId: e.medId, dose, opts: { force: true }, timeValue: iso } });
}

function tempDefault() { return CONFIG.tempUnit === 'Celsius' ? '36.9' : '98.5'; }
async function logTemp() {

async function confirmTimeAndLog() {
  const m = state.timeModal;
  if (!m) return;
  const ts = new Date(m.timeValue).getTime();
  if (isNaN(ts)) { setToast('Invalid time'); return; }
  if (ts > simNow() + 60000 && !m.futureOk) { state.timeModal.futureOk = true; setState({ timeModal: state.timeModal }); return; }

  if (m.type === 'med') {
    const med = state.meds.find(x => x.id === m.medId);
    if (med.painScale && !m.painLevel) { setToast('Select a pain level before logging ' + med.name); return; }
    const entry = { medId: m.medId, dose: m.dose ? m.dose.label : null, mg: m.dose ? (m.dose.mg || 0) : 0, ts };
    if (m.dose && m.dose.pills) entry.pills = m.dose.pills;
    if (med.volumePerDoseMl) entry.volumeMl = med.volumePerDoseMl;
    if (med.painScale && m.painLevel) entry.painLevel = m.painLevel;
    const early = !!(m.opts && m.opts.force) && isEarlyAt(med, ts);
    if (early) entry.override = true;
    setState({ timeModal: null });
    await addEntryDB(entry);
    setToast(med.name + ' logged' + (m.dose ? (' · ' + m.dose.label) : '') + (entry.painLevel ? (' · Pain ' + entry.painLevel + '/10') : '') + (early ? ' (early)' : '') + ' at ' + fmtTime(ts));
    setTimeout(() => afterLog({ ...entry, id: 'pending' }), 500);
  } else if (m.type === 'temp') {
    const v = m.tempValue;
    const suffix = tempSuffix();
    const entry = { medId: 'temp', temp: v, dose: v + ' ' + suffix, mg: 0, ts };
    setState({ tempInput: '', timeModal: null });
    await addEntryDB(entry);
    setToast('Temperature ' + v + ' ' + suffix + ' logged at ' + fmtTime(ts));
  } else if (m.type === 'weight') {
    const v = m.weightValue;
    const entry = { medId: 'weight', weight: v, dose: v + ' lbs', mg: 0, ts };
    setState({ weightInput: '', timeModal: null });
    await addEntryDB(entry);
    setToast('Weight ' + v + ' lbs logged at ' + fmtTime(ts));
  } else if (m.type === 'para') {
    const v = m.paraValue;
    const entry = { medId: PARA_MED_ID, paraId: paraNewId(), liters: v, dose: paraFmtLiters(v) + ' L',
                    mg: 0, ts, loggedAt: Date.now() };
    setState({ paraInput: '', timeModal: null });
    await addEntryDB(entry);
    setToast('Paracentesis ' + paraFmtLiters(v) + ' L logged at ' + fmtTime(ts));
  } else if (m.type === 'multi') {
    const ids = m.medIds;
    setState({ timeModal: null });
    for (const id of ids) {
      const md = state.meds.find(x => x.id === id);
      const d0 = md && md.doses ? md.doses[0] : null;
      const en = { medId: id, dose: d0 ? d0.label : null, mg: d0 ? (d0.mg || 0) : 0, ts };
      if (d0 && d0.pills) en.pills = d0.pills;
      await addEntryDB(en);
    }
    setToast(ids.length + ' meds logged at ' + fmtTime(ts));
    setTimeout(() => { if (ids.includes('iron')) afterLog({ medId: 'iron', ts, id: 'pending' }); }, 500);
  } else if (m.type === 'marker') {
    setState({ timeModal: null });
    await addEntryDB({ medId: m.medId, dose: null, mg: 0, ts });
    setToast(m.label + ' logged for ' + new Date(ts).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) + ' at ' + fmtTime(ts));
  } else if (m.type === 'symptom') {
    if (!m.symptomType) { setToast('Select a symptom first'); return; }
    if (m.symptomType === 'other' && !(m.note || '').trim()) { setToast('Describe the symptom before saving'); return; }
    const editId = m.editId;
    setState({ timeModal: null });
    if (editId) await removeEntryDB(editId);
    await logSymptom(m.symptomType, ts, { note: (m.note || '').trim() });
    setToast((SYMPTOM_TYPES[m.symptomType] || m.symptomType) + (editId ? ' updated' : ' logged') + ' at ' + fmtTime(ts));
  }
}

// ---- Menstrual cycle tracking ----
// Instant one-tap events, no time picker — logs at the current moment.
function cycleEntries() { return state.entries.filter(e => e.medId === 'cycle_start' || e.medId === 'cycle_end').sort((a, b) => a.ts - b.ts); }
function cycleActive() {
  const es = cycleEntries();
  if (!es.length) return false;
  return es[es.length - 1].medId === 'cycle_start';
}
function lastCycleStart() {
  const es = entriesFor('cycle_start');
  return es.length ? es.reduce((a, b) => a.ts > b.ts ? a : b) : null;
}
function daysSinceCycleStart() {
  const last = lastCycleStart();
  if (!last) return null;
  return Math.floor((dayStart(state.now) - dayStart(last.ts)) / 86400000) + 1; // start day counts as Day 1
}
async function logCycleStart() { await addEntryDB({ medId: 'cycle_start', dose: null, mg: 0, ts: simNow() }); setToast('Period start logged'); }
async function logCycleEnd() { await addEntryDB({ medId: 'cycle_end', dose: null, mg: 0, ts: simNow() }); setToast('Period end logged'); }
function cyclePeriods() {
  // Pairs cycle_start/cycle_end chronologically into periods; the most recent period has end:null
  // if it's still active. Returned most-recent-first for display.
  //
  // A second cycle_start logged while one is already open (no cycle_end between them — e.g. a
  // double-tap, or correcting an accidental Start via the "+" log-for-another-day control) does
  // NOT start a second period. It updates the still-open period's start time instead. This keeps
  // this list consistent with cycleActive()/daysSinceCycleStart(), which already treat only the
  // single latest event as authoritative — without this, the earlier open period would be
  // orphaned and stuck showing as "Active" in history forever, even after a real Period End is
  // later logged against the newer start. Found live during the 30-use-case QA pass (UC20): two
  // back-to-back Period Starts around 7/14 left a permanently un-closeable "7/14/2026 – Active"
  // duplicate in Cycle History.
  const events = cycleEntries();
  const periods = [];
  let cur = null;
  events.forEach(e => {
    if (e.medId === 'cycle_start') {
      if (cur && cur.end === null) { cur.start = e.ts; }
      else { cur = { start: e.ts, end: null }; periods.push(cur); }
    }
    else if (e.medId === 'cycle_end' && cur && cur.end === null) { cur.end = e.ts; }
  });
  return periods.reverse();
}
function fmtCyclePeriod(p) {
  const startLabel = fmtInpatientDate(p.start);
  if (p.end === null) return startLabel + ' – Active';
  const days = Math.round((dayStart(p.end) - dayStart(p.start)) / 86400000) + 1;
  const endLabel = fmtInpatientDate(p.end);
  return startLabel === endLabel ? startLabel : startLabel + ' – ' + endLabel + ' (' + days + ' day' + (days === 1 ? '' : 's') + ')';
}

// ---- Bowel Movement tracking ----
// One retrospective daily entry (usually), value one of: normal / very_little / none / diarrhea,
// tagged to the day being reported on. An "issue" is active for as long as the most recent
// consecutive daily answers are none/diarrhea; it ends the first day a normal/very_little answer
// is given. Derived entirely from the daily entries themselves — no separate start/end markers —
// so there's a single source of truth shared by the retrospective card and the Symptoms tab
// (a Diarrhea/Constipation entry there can start/continue this same tracker, but only a genuine
// daily answer of normal/very_little can end it).
const BOWEL_ISSUE_VALUES = new Set(['none', 'diarrhea']);
const BOWEL_MOVEMENT_LABELS = { normal: 'Normal', very_little: 'Very little', none: 'None', diarrhea: 'Diarrhea' };
function yesterdayStart(now) { return dayStart(now) - 86400000; }

// ---- END-OF-DAY CHECK-INS (bowel movement, appetite) ----
// These two are asked about TODAY, and only once the day is effectively over. 18:00 is not a new
// number: dailyAlertLevel() already treats it as the urgent threshold, so this reuses the app's
// own established end-of-day boundary rather than inventing a second one.
// Before this, both asked about YESTERDAY from midnight onward -- so the first thing the app said
// each morning was a question about a day that had already gone. A day's answer is only complete
// once the day is.
const EOD_HOUR = 18;   // the card appears
const EOD_URGENT = 21; // and turns urgent
function eodActive(now) { return new Date(now).getHours() >= EOD_HOUR; }
function eodAlertLevel(now) {
  const hr = new Date(now).getHours();
  if (hr >= EOD_URGENT) return 2;
  if (hr >= EOD_HOUR) return 1;
  return 0;
}
// Shared "must be answered today" escalation rules — quiet reminder in the morning, firmer by
// afternoon, urgent by evening. Used by the Daily Weight, Bowel Movement, and Appetite Home
// alerts so all three escalate identically rather than each having its own copy of the logic.
function dailyAlertLevel(now) {
  const hourNow = new Date(now).getHours();
  return hourNow >= 18 ? 2 : hourNow >= 12 ? 1 : 0; // 0 quiet, 1 firm, 2 urgent
}
function dailyAlertStyle(level) {
  const color = level === 2 ? '#C0453B' : level === 1 ? '#9A6419' : '#8E3D61';
  const bg = level === 2 ? 'rgba(192,69,59,0.14)' : level === 1 ? 'rgba(154,100,25,0.12)' : 'rgba(170,83,117,0.10)';
  const border = level === 2 ? '2px solid #C0453B' : level === 1 ? '2px solid #9A6419' : '1px solid rgba(170,83,117,0.3)';
  const shadow = level ? ('0 4px 24px rgba(' + (level === 2 ? '192,69,59' : '154,100,25') + ',0.18)') : 'none';
  return { color, bg, border, shadow };
}
function bowelMovementEntriesByDay() {
  const map = new Map();
  state.entries.filter(e => e.medId === 'bowel_movement').forEach(e => {
    const d0 = dayStart(e.ts);
    const existing = map.get(d0);
    if (!existing || e.ts >= existing.ts) map.set(d0, e);
  });
  return map;
}
function bowelMovementFor(dayStartTs) { return bowelMovementEntriesByDay().get(dayStartTs) || null; }
function latestBowelDay() {
  const byDay = bowelMovementEntriesByDay();
  if (!byDay.size) return null;
  const days = [...byDay.keys()].sort((a, b) => b - a);
  return days[0];
}
function bowelMovementHistorySorted() { return [...bowelMovementEntriesByDay().values()].sort((a, b) => b.ts - a.ts); }
async function logBowelMovement(value, dayStartTs) {
  await addEntryDB({ medId: 'bowel_movement', value, dose: BOWEL_MOVEMENT_LABELS[value] || value, mg: 0, ts: dayStartTs + 12 * 3600000 });
}
function bowelIssueActive() {
  const byDay = bowelMovementEntriesByDay();
  if (!byDay.size) return false;
  const days = [...byDay.keys()].sort((a, b) => b - a);
  return BOWEL_ISSUE_VALUES.has(byDay.get(days[0]).value);
}
function currentBowelIssueType() {
  const byDay = bowelMovementEntriesByDay();
  if (!byDay.size) return null;
  const days = [...byDay.keys()].sort((a, b) => b - a);
  const latest = byDay.get(days[0]);
  return BOWEL_ISSUE_VALUES.has(latest.value) ? latest.value : null;
}
function daysSinceBowelIssueStart() {
  const byDay = bowelMovementEntriesByDay();
  if (!byDay.size) return null;
  const days = [...byDay.keys()].sort((a, b) => b - a);
  if (!BOWEL_ISSUE_VALUES.has(byDay.get(days[0]).value)) return null;
  let count = 0, expected = days[0];
  for (const d of days) {
    if (d !== expected) break; // a gap in consecutive daily answers breaks the streak
    if (!BOWEL_ISSUE_VALUES.has(byDay.get(d).value)) break;
    count++;
    expected = d - 86400000;
  }
  return count;
}
// Overwrites (rather than appends to) a given day's retrospective answer, so there's always at
// most one bowel_movement entry per day — keeps the "last daily answer wins" derivation above
// unambiguous even when the user changes their mind and hits Update.
async function submitBowelMovement(dayStartTs) {
  const v = state.bowelInput;
  if (!v) { setToast('Select a bowel movement status first'); return; }
  try {
    const existing = bowelMovementFor(dayStartTs);
    if (existing) await removeEntryDB(existing.id);
    await logBowelMovement(v, dayStartTs);
    setState({ bowelInput: undefined });
    setToast('Bowel movement logged — ' + (BOWEL_MOVEMENT_LABELS[v] || v));
  } catch (e) {
    setToast('Could not save — check connection and try again');

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  let deferredValue;
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'style' && typeof v === 'object') {
        Object.assign(el.style, v);
      } else if (k.startsWith('on') && typeof v === 'function') {
        el.addEventListener(k.slice(2).toLowerCase(), v);
      } else if (k === 'innerHTML') {
        el.innerHTML = v;
      } else if (k === 'className') {
        el.className = v;
      } else if (k === 'ref' && typeof v === 'function') {
        v(el);
      } else if (k === 'value' && (tag === 'select' || tag === 'textarea' || tag === 'input')) {
        // THE TRAP THIS APP KEPT FALLING INTO, fixed at the source rather than site by site.
        // setAttribute('value', ...) sets the DEFAULT value, not the current one:
        //   - on <textarea> it is ignored entirely (a textarea is filled by its text child), so a
        //     saved note rendered EMPTY and the first keystroke replaced it;
        //   - on <select> it does nothing at all -- selection is carried by <option selected> --
        //     so the medication editor showed "As needed" for a SCHEDULED medication, and anyone
        //     who "corrected" that would have silently switched off its missed-dose alerts;
        //   - on <input> it survives only until the value is edited, after which a re-render shows
        //     stale text.
        // The attribute is still set, so anything relying on the HTML default is unaffected; the
        // property is set as well, deferred until after children exist because a <select> has no
        // options to choose from at attribute time.
        el.setAttribute(k, v === null || v === undefined ? '' : v);
        deferredValue = v;
      } else {
        el.setAttribute(k, v);
      }
    }
  }
  for (const child of children.flat(Infinity)) {
    if (child == null || child === false) continue;
    el.appendChild(typeof child === 'string' || typeof child === 'number' ? document.createTextNode(String(child)) : child);
  }
  // Applied AFTER children, because a <select> has no options to choose from until they exist.
  // Setting the property is what makes this the CURRENT value, so it survives a re-render instead
  // of snapping back to a stale default.
  if (deferredValue !== undefined) {
    try { el.value = deferredValue === null ? '' : deferredValue; } catch (err) {}
  }
  return el;
}

}

// =================================================================================================
// MISSED-DOSE REASONS   (the ChemoWell "Reason for change" interaction, attached to missed doses)
//
// WHAT WAS PORTED.  ChemoWell has no missed-dose reason picker — its missed doses are resolved with
// "Took later", "Skipped" and "Clear", and none of the three records why.  What it does have is the
// optional "Reason for change" quick-select on a WEIGHT log: a short tap-to-pick list that can
// always be skipped, stored on the record, shown back in History and summarised in the Weight
// report.  That is the interaction being ported.  The list of reasons is new — ChemoWell's is about
// fluid and appetite — and the wording is argued line by line in REASON-REPORT.md.
//
// WHAT A REASON IS ATTACHED TO.  A missed dose in care-tracker is not a document.  missedDosesFor()
// recomputes it from the medication schedule on every single render, so there is no id to hang a
// reason from.  Identity here is `medication id + window-start timestamp` — the exact pair the miss
// object already carries and the banner already prints.  It is stable across re-derivation because
// the window start is dayStart(day) + startHour: a pure function of the day and the saved schedule.
// The consequences, stated here rather than discovered later:
//   * Change a window's START HOUR in the medication editor and reasons recorded against the old
//     window stop matching.  That is correct — the window they described no longer exists.
//   * RENAME a window and the reason survives, because the name is not part of the key.  Renaming
//     is common; re-timing is not.  That is the trade the key is making.
//   * Two windows on one medication that start at the same hour share one key.  They are already
//     indistinguishable to the banner and to the CSV, and one reason covering both is the
//     least-wrong answer available.
//   * Log the dose late, the window becomes covered, the miss disappears — and the reason goes with
//     it, because a reason is only ever read through a currently-derived miss.  The document stays
//     in Firestore (nothing here deletes anything) and reappears if the miss ever does.
//
// WHY EVERY CHANGE IS AN INSERT.  This project's Firestore rules are append-only: existing documents
// cannot be edited, and deletes are refused after 48 hours.  So changing an answer APPENDS a new
// document for the same key and the newest loggedAt wins (mrSupersedes); removing an answer APPENDS
// one with an empty reasonId.  Nothing in this block calls updateDoc, setDoc or deleteDoc.  People
// mis-tap, and a mis-tap must be fixable on a screen where nothing can be un-said.
//
// WHY IT IS NOT IN THE CSV.  Reason documents are removed from state.entries the moment they arrive
// (see subscribeEntries), so allExportEntries() — and therefore the CSV — never sees one, and the
// export's byte format is untouched.  That is deliberate and it is a trade-off, stated loudly in
// REASON-REPORT.md: the CSV is the backup, and reasons are currently not in it.
//
// TONE.  Recording a reason is optional everywhere and blocks nothing.  There is no prompt, no
// badge, no count, no red, no "1 of 3 explained" and no unfinished-business styling anywhere in
// this block.  The only way to reach it is to deliberately tap one quiet button on a missed row.  A
// patient on chemotherapy does not have to justify a missed dose to use her own app.
// =================================================================================================

// Its own medId namespace inside caretracker_entries.  A NEW collection was the tidier option and
// was rejected: the published security rules match named collections, and a client write to an
// unmatched path is refused — the feature would fail silently on the live build and work perfectly
// in every harness.  It must never be a real medication's id: missedDosesFor() counts any same-day
// entry under a medication's own id as covering a window, so a reason filed under 'protonix' would
// erase the very miss it describes.
const MR_MED_ID = 'missed_reason';
const MR_NOTE_MAX = 140;

// THE WORDING.  Two options, matching ChemoWell exactly, per Aaron's explicit decision:
// "took later, skipped and clear are the reasons".  Clear is not a third chip -- it is the
// "Remove this reason" action below, which appends an empty answer (the rules are append-only,
// so nothing is ever deleted).  An earlier build offered nine illness-first options; Aaron
// reviewed them and chose the ChemoWell set instead.  Do not re-expand this list without asking
// him -- the shorter list is the requirement, not an oversight.
//
// mrLabelFor() falls back to the label stored on the document, so any answer written by a build
// that offered more options still prints as words rather than as a slug.
const MR_REASONS = [
  { id: 'later',   label: 'Took it later' },
  { id: 'skipped', label: 'Skipped' }
];
const MR_NOTE_ONLY_LABEL = 'Described in the note';

// Resolves an id to its label.  A document written by an older build carries the label it was shown
// at the time, so an id this build no longer knows still prints as words rather than as a slug.
function mrLabelFor(id, fallbackLabel) {
  const found = MR_REASONS.find((r) => r.id === id);
  if (found) return found.label;
  const fb = String(fallbackLabel || '').trim();
  return fb || MR_NOTE_ONLY_LABEL;
}

// The identity of a missed dose.  See the block comment above for why it is this pair and what that
// costs.  Number() and String() are not decoration: these two values come back off the wire.
function mrKey(medId, ts) { return String(medId) + '|' + Number(ts); }
function mrKeyOf(miss) { return miss ? mrKey(miss.medId, miss.ts) : ''; }

// Append-only supersede: newest loggedAt wins.  The document-id tie-break makes the winner
// deterministic when two writes land in the same millisecond, so two devices resolving the same
// pair of documents cannot disagree about which one is current.
function mrSupersedes(next, prev) {
  const a = (typeof next.loggedAt === 'number' && isFinite(next.loggedAt)) ? next.loggedAt : 0;
  const b = (typeof prev.loggedAt === 'number' && isFinite(prev.loggedAt)) ? prev.loggedAt : 0;
  if (a !== b) return a > b;
  return String(next.id || '') > String(prev.id || '');
}

// Collapses every reason document down to one winner per missed-dose key.  A Map, not an object
// literal: the key contains a medication id, medication ids are user-supplied, and a medication
// named "constructor" or "toString" against a plain {} yields an inherited function where a record
// should be — truthy, not a record, and every read downstream breaks in a different place.
function mrResolveReasons(docs) {
  const out = new Map();
  (docs || []).forEach((d) => {
    if (!d || d.medId !== MR_MED_ID) return;
    if (typeof d.missMedId !== 'string' || !d.missMedId) return;
    const ts = Number(d.missTs);
    if (!isFinite(ts) || ts <= 0) return;
    const rec = {
      id: d.id,
      key: mrKey(d.missMedId, ts),
      missMedId: d.missMedId,
      missTs: ts,
      missWindow: String(d.missWindow || ''),
      reasonId: String(d.reasonId || ''),
      reasonLabel: String(d.reasonLabel || ''),
      note: String(d.note || ''),
      loggedAt: d.loggedAt
    };
    const prev = out.get(rec.key);
    if (!prev || mrSupersedes(rec, prev)) out.set(rec.key, rec);
  });
  return out;
}

// The current reason for one missed dose, or null.  A record whose reasonId and note are both empty
// is a removal — it exists only because nothing can be deleted, and it reads as "no reason".
function mrReasonFor(miss) {
  const map = state.missReasons;
  if (!miss || !map || typeof map.get !== 'function') return null;
  const rec = map.get(mrKeyOf(miss));
  if (!rec) return null;
  if (!rec.reasonId && !rec.note) return null;
  return rec;
}

function mrOpenSheet(miss) {
  if (!miss) return;
  const existing = mrReasonFor(miss);
  setState({ missReasonSheet: {
    medId: miss.medId,
    ts: miss.ts,
    windowName: String(miss.windowName || ''),
    reasonId: existing ? existing.reasonId : '',
    note: existing ? existing.note : '',
    hadSaved: !!existing,
    busy: false,
    error: ''
  } });
}

function mrCloseSheet() { setState({ missReasonSheet: null }); }

// Chip taps go through setState because they change what is drawn.  The note field never does —
// setState rebuilds the whole tree and would destroy the textarea being typed into, taking the
// caret and the IME composition with it.  The draft is written straight onto the state object and
// is read back by the next render, which is what makes the sheet survive a repaint intact.
function mrToggleReason(id) {
  const s = state.missReasonSheet;
  if (!s || s.busy) return;
  setState({ missReasonSheet: Object.assign({}, s, { reasonId: s.reasonId === id ? '' : id, error: '' }) });
}

async function mrSaveReason() {
  const s = state.missReasonSheet;
  if (!s || s.busy) return;
  const reasonId = String(s.reasonId || '');
  const note = String(s.note || '').slice(0, MR_NOTE_MAX).trim();
  // Save with nothing chosen is not an error and does not scold: it means "never mind".  If there
  // was a saved reason it is removed, otherwise the sheet simply closes.
  if (!reasonId && !note) { await mrRemoveReason(); return; }
  setState({ missReasonSheet: Object.assign({}, s, { busy: true, error: '' }) });
  try {
    await addEntryDB({
      medId: MR_MED_ID,
      missMedId: String(s.medId),
      missTs: Number(s.ts),
      missWindow: String(s.windowName || ''),
      reasonId: reasonId,
      // A snapshot of the words shown when it was tapped, so a future edit to MR_REASONS cannot
      // retroactively change what a past record says.
      reasonLabel: reasonId ? mrLabelFor(reasonId, '') : '',
      note: note,
      // ts mirrors the window it describes so a raw dump of the collection still sorts sensibly.
      ts: Number(s.ts),
      mg: 0,
      dose: 'Missed-dose reason',
      loggedAt: Date.now()
    });
    setState({ missReasonSheet: null });
    setToast('Saved. You can change it any time.');
  } catch (err) {
    console.error('[missed-reason:save]', err);
    const cur = state.missReasonSheet;
    if (cur) setState({ missReasonSheet: Object.assign({}, cur, { busy: false, error: "Couldn't save that just now — your records are safe. Please try again." }) });
  }
}

// Removal is an append, not a delete.  The rules refuse a delete after 48 hours, and a reason
// recorded last week must still be retractable.
async function mrRemoveReason() {
  const s = state.missReasonSheet;
  if (!s || s.busy) return;
  if (!s.hadSaved) { mrCloseSheet(); return; }
  setState({ missReasonSheet: Object.assign({}, s, { busy: true, error: '' }) });
  try {
    await addEntryDB({
      medId: MR_MED_ID,
      missMedId: String(s.medId),
